# gh-pages is written only by GitHub Actions. Close any pull request that
# targets it. (The ruleset already prevents merging; this keeps things tidy.)
# pull_request_target is safe here: no code from the pull request is checked out.
name: Guard gh-pages

on:
  pull_request_target:
    types: [opened, reopened]
    branches: [gh-pages]

permissions:
  pull-requests: write

jobs:
  close:
    name: Close pull request
    runs-on: ubuntu-latest
    steps:
      - name: Close with an explanation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR_NUMBER" --repo "$REPO" --comment \
            "gh-pages is generated by GitHub Actions and does not accept pull requests. Please open your pull request against \`main\` instead."
