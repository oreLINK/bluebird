# yaml-language-server: $schema=./schemas/tiles.schema.json
#
# Tiles are the KPI containers displayed on the page.
#   type:    frontend component, registered in web/src/tiles/registry.ts:
#              banner       betting-app card: banner (photo or illustration),
#                           top stations as odds buttons, "see all" for the rest
#                           (TileBanner.svelte)
#              banner_full  same, with the photo or illustration filling the
#                           whole card behind the title and odds (TileBannerFull)
#              simple       a banner tile without the banner: shorter card with
#                           title, odds buttons and "see all", for the KPIs
#                           lower on the page (TileSimple.svelte)
#              ranking      compact list of every station (TileRanking.svelte)
#   kpis:    KPI ids (config/kpis.yaml) the tile reads; tiles show the first one.
#            Every type works for live KPIs (probabilities) and for historical
#            KPIs (Rewind values: "4,43 m", "46 h"). A historical tile takes the
#            theme of its Rewind's filter (Christmas red) and a "REWIND 25/26"
#            badge; odds and details are live only.
#   title:   optional; defaults to the first KPI's name (followed by the period
#            for live KPIs). For live KPIs it must contain {period}, replaced by
#            the period label of config/periods.yaml ("Neige {period}" ->
#            "Neige ce soir"); Rewind titles have no {period}.
#   periods: optional, live KPIs only; the periods to show a tile for (default:
#            every period of its KPIs). The page shows one tile per period not
#            yet over, in chronological order, then in config/layout.yaml order.
#            Rewind tiles are shown once.
#   icon:    optional; one of the icons in web/src/components/Icon.svelte.
#   options: free-form, interpreted by the tile component:
#              every type: theme (default | rewind) overrides the colour theme.
#              every type: details (default false): tapping a station
#                       shows its details (drivers, reliability, elevation).
#                       Turned off for now: tiles show the probability only.
#              banner, banner_full:
#                       top (1-3, default 3), show_odds,
#                       scene (snowfall | piste | offpiste | mountain; default from icon),
#                       photo (none | leader | <path in web/src/assets/photos>);
#                       `leader` shows the photo of the ski area ranked first and
#                       falls back to the illustration when there is none.
#              simple:  top (1-3, default 3), show_odds
#              ranking: visible_rows (default 5), show_odds
#
# Tile order on the page is defined in config/layout.yaml, not here.
tiles:
  - id: snowfall_today
    type: banner_full
    kpis: [snowfall_chance]
    title: { fr: "Neige {period}", en: "Snow {period}" }
    icon: snowflake
    options:
      top: 3
      show_odds: false
      photo: leader
      scene: snowfall

  - id: onpiste_powder
    type: banner
    kpis: [onpiste_powder_chance]
    title: { fr: "Poudreuse sur piste {period}", en: "On-piste powder {period}" }
    icon: piste
    options:
      top: 3
      show_odds: false
      photo: leader
      scene: piste

  - id: offpiste_powder
    type: simple
    kpis: [offpiste_powder_chance]
    title: { fr: "Poudreuse hors-piste {period}", en: "Off-piste powder {period}" }
    icon: mountain
    options:
      top: 3
      show_odds: false

  # Sky: white days today and tomorrow (live, filter "Ciel").
  - id: whiteout
    type: simple
    kpis: [whiteout_chance]
    title: { fr: "Jour blanc {period}", en: "White day {period}" }
    icon: fog
    options:
      top: 3

  # Bluebird day: fresh snow then a sunny ski day, today and tomorrow.
  - id: bluebird_day
    type: banner
    kpis: [bluebird_day_chance]
    title: { fr: "Journée bluebird {period}", en: "Bluebird day {period}" }
    icon: sun
    options:
      top: 3
      photo: leader
      scene: mountain

  # Live KPIs built from the data already fetched (one category filter each).
  - id: powder_alert
    type: simple
    kpis: [powder_alert_chance]
    title: { fr: "Alerte neige {period}", en: "Snow alert {period}" }
    icon: snowflake
    options:
      top: 3

  - id: snowmaking
    type: simple
    kpis: [snowmaking_chance]
    title: { fr: "Canons à neige {period}", en: "Snow cannons {period}" }
    icon: snowflake
    options:
      top: 3

  - id: spring_snow
    type: simple
    kpis: [spring_snow_chance]
    title: { fr: "Neige de printemps {period}", en: "Spring snow {period}" }
    icon: piste
    options:
      top: 3

  - id: hard_snow
    type: simple
    kpis: [hard_snow_chance]
    title: { fr: "Neige dure {period}", en: "Hard snow {period}" }
    icon: piste
    options:
      top: 3

  - id: heavy_snow
    type: simple
    kpis: [heavy_snow_chance]
    title: { fr: "Neige lourde {period}", en: "Heavy snow {period}" }
    icon: piste
    options:
      top: 3

  - id: easy_conditions
    type: simple
    kpis: [easy_conditions_chance]
    title: { fr: "Conditions faciles {period}", en: "Easy conditions {period}" }
    icon: piste
    options:
      top: 3

  - id: sunset
    type: banner
    kpis: [sunset_chance]
    title: { fr: "Coucher de soleil {period}", en: "Sunset {period}" }
    icon: sunset
    options:
      top: 3
      photo: leader
      scene: mountain

  - id: starry_night
    type: simple
    kpis: [starry_night_chance]
    title: { fr: "Nuit étoilée {period}", en: "Starry night {period}" }
    icon: moon
    options:
      top: 3

  - id: sunny_slot
    type: simple
    kpis: [sunny_slot_chance]
    title: { fr: "Grand soleil {period}", en: "Full sun {period}" }
    icon: sun
    options:
      top: 3

  - id: wind_chill
    type: simple
    kpis: [wind_chill_chance]
    title: { fr: "Froid ressenti {period}", en: "Wind chill {period}" }
    icon: thermometer
    options:
      top: 3

  - id: mild_day
    type: simple
    kpis: [mild_day_chance]
    title: { fr: "Journée douce {period}", en: "Mild day {period}" }
    icon: sun
    options:
      top: 3

  - id: chains
    type: simple
    kpis: [chains_chance]
    title: { fr: "Chaînes nécessaires {period}", en: "Chains needed {period}" }
    icon: car
    options:
      top: 3

  - id: lift_wind
    type: simple
    kpis: [lift_wind_chance]
    title: { fr: "Remontées au vent {period}", en: "Lifts in the wind {period}" }
    icon: wind
    options:
      top: 3

  - id: wind_slab
    type: simple
    kpis: [wind_slab_chance]
    title: { fr: "Neige ventée {period}", en: "Wind-blown snow {period}" }
    icon: alert
    options:
      top: 3

  # Rewind 25/26: one tile per historical KPI, shown only under its filter
  # (config/rewinds.yaml finds the Rewind of each KPI). Same tile types as the
  # live KPIs, in the Rewind theme.
  - id: rewind_2025_26_total_snowfall
    type: banner_full
    kpis: [season_total_snowfall]
    title: { fr: Le plus de neige, en: Most snow }
    icon: snowflake
    options:
      photo: leader
      scene: snowfall

  - id: rewind_2025_26_longest_snowfall
    type: banner
    kpis: [season_longest_snowfall]
    title: { fr: La plus longue chute de neige, en: Longest snowfall }
    icon: snowflake
    options:
      photo: leader
      scene: snowfall

  - id: rewind_2025_26_domain_snowfall
    type: banner
    kpis: [season_domain_snowfall]
    title: { fr: Le plus de neige sur le domaine, en: Most snow on the slopes }
    icon: piste
    options:
      photo: leader
      scene: piste

  - id: rewind_2025_26_offpiste_snowfall
    type: banner
    kpis: [season_offpiste_snowfall]
    title: { fr: Le plus de neige hors-piste, en: Most off-piste snow }
    icon: mountain
    options:
      photo: leader
      scene: offpiste

  - id: rewind_2025_26_deep_snow_days
    type: banner
    kpis: [season_deep_snow_days]
    title: { fr: L'enneigement idéal, en: Ideal snow cover }
    icon: piste
    options:
      photo: leader
      scene: piste

  - id: rewind_2025_26_white_days
    type: banner
    kpis: [season_white_days]
    title: { fr: Le moins de jours blancs, en: Fewest white days }
    icon: fog
    options:
      photo: leader
      scene: mountain
