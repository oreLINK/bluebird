  - id: easy_conditions
    format: compact
    kpis: [easy_conditions_chance]
    title: { fr: "Conditions faciles {period}", en: "Easy conditions {period}", es: "Condiciones fáciles {period}" }
    icon: piste
    options:
      top: 3

  - id: sunset
    format: banner
    visual: photo
    kpis: [sunset_chance]
    title: { fr: "Coucher de soleil {period}", en: "Sunset {period}", es: "Puesta de sol {period}" }
    icon: sunset
    options:
      top: 3
      scene: mountain

  - id: starry_night
    format: compact
    kpis: [starry_night_chance]
    title: { fr: "Nuit étoilée {period}", en: "Starry night {period}", es: "Noche estrellada {period}" }
    icon: moon
    options:
      top: 3

  - id: sunny_slot
    format: compact
    kpis: [sunny_slot_chance]
    title: { fr: "Grand soleil {period}", en: "Full sun {period}", es: "Pleno sol {period}" }
    icon: sun
