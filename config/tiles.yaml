  - id: wind_slab
    format: compact
    kpis: [wind_slab_chance]
    title: { fr: "Neige ventée {period}", en: "Wind-blown snow {period}", es: "Nieve venteada {period}" }
    icon: alert
    options:
      top: 3

  # Rewind 25/26: one tile per historical KPI, shown only under its filter
  # (config/rewinds.yaml finds the Rewind of each KPI). Same tile types as the
  # live KPIs, in the Rewind theme.
  - id: rewind_2025_26_total_snowfall
    format: full
    visual: photo
    kpis: [season_total_snowfall]
    title: { fr: Le plus de neige, en: Most snow, es: Más nieve }
    icon: snowflake
    options:
      scene: snowfall

  - id: rewind_2025_26_longest_snowfall
    format: banner
    visual: photo
