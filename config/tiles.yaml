  - id: wind_chill
    format: compact
    kpis: [wind_chill_chance]
    title: { fr: "Froid ressenti {period}", en: "Wind chill {period}", es: "Sensación térmica {period}" }
    icon: thermometer
    options:
      top: 3

  - id: mild_day
    format: compact
    kpis: [mild_day_chance]
    title: { fr: "Journée douce {period}", en: "Mild day {period}", es: "Día templado {period}" }
    icon: sun
    options:
