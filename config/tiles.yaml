# yaml-language-server: $schema=./schemas/tiles.schema.json
#
# Tiles are the KPI containers displayed on the page. They are classified on
# three axes (plus the kind of their KPIs):
#   scope:   how many stations the tile shows. `ranking` (default): every
#            station ranked on one KPI. (`station`, one resort, is planned.)
#   format:  size and layout, one component each in web/src/tiles/registry.ts:
#              full     the image fills the whole card behind the title and the
#                       odds buttons (TileFull.svelte)
#              banner   image band on top, title, top stations as odds buttons,
#                       "see all" for the rest (TileBanner.svelte)
#              compact  a banner tile without the image: half as tall, for the
#                       KPIs lower on the page (TileCompact.svelte)
#   visual:  image of `full` and `banner` tiles (not allowed on `compact`):
#              scene    (default) an illustration, chosen by option `scene`
#              photo    a photo of the station ranked first (drawn once per page
#                       load), else the illustration
#            (`webcam` as a background is planned.)
#   kind:    not set here: live (forecasts, one tile per period) or historical
#            (a Rewind, red theme) comes from the KPIs in config/kpis.yaml.
#
#   kpis:    KPI ids (config/kpis.yaml) the tile reads; tiles show the first one.
#            Every format works for live KPIs (probabilities) and for historical
#            KPIs (Rewind values: "4,43 m", "46 h"). A historical tile takes the
#            theme of its Rewind's filter (Christmas red) and a "REWIND 25/26"
#            badge; odds and details are live only.
#   title:   optional; defaults to the first KPI's name. Never contains the
#            period ({period} is refused): each tile of live KPIs carries a time
#            badge instead, day + moment ("Demain | Matin") in the colour of
#            the moment (`days`, `badge`/`chip` and `tone` of
#            config/periods.yaml). Rewind tiles have no time badge.
#   periods: optional, live KPIs only; the periods to show a tile for (default:
#            every period of its KPIs). The page shows one tile per period not
#            yet over, in chronological order, then in config/layout.yaml order.
#            Rewind tiles are shown once.
#   webcam:  optional, live `full` and `banner` tiles: a LIVE badge in the top
#            left corner (under the time badge) links the official page of the leading station's
#            webcam (`webcams` of config/stations/<massif>.yaml) when
#              - the period is today's and in progress,
#              - that station has a webcam at one of `positions` (summit,
#                slopes, village, nordic; first match wins),
#              - its probability reaches `min_probability` (default 0.6).
#            The webcam image itself is never shown (rights not cleared).
#   icon:    optional; one of the icons in web/src/components/Icon.svelte.
#   options: free-form, interpreted by the tile component:
#              every format: theme (default | rewind) overrides the colour theme.
#              every format: details (default false): tapping a station
#                       shows its details (drivers, reliability, elevation).
#                       Turned off for now: tiles show the probability only.
#              every format: top (1-3, default 3), show_odds.
#              full, banner: scene (snowfall | piste | offpiste | mountain;
#                       default from icon).
#
# Tile order on the page is defined in config/layout.yaml, not here.
tiles:
  - id: snowfall_today
    format: full
    visual: photo
    kpis: [snowfall_chance]
    title: { fr: Neige, en: Snow, es: Nieve }
    icon: snowflake
    options:
      top: 3
      show_odds: false
      scene: snowfall

  - id: onpiste_powder
    format: banner
    visual: photo
    kpis: [onpiste_powder_chance]
    title: { fr: Poudreuse sur piste, en: On-piste powder, es: Nieve polvo en pista }
    icon: piste
    options:
      top: 3
      show_odds: false
      scene: piste

  - id: offpiste_powder
    format: compact
    kpis: [offpiste_powder_chance]
    title: { fr: Poudreuse hors-piste, en: Off-piste powder, es: Nieve polvo fuera de pista }
    icon: mountain
    options:
      top: 3
      show_odds: false

  # Sky: white days today and tomorrow (live, filter "Ciel").
  - id: whiteout
    format: compact
    kpis: [whiteout_chance]
    title: { fr: Jour blanc, en: White day, es: Día blanco }
    icon: fog
    options:
      top: 3

  # Bluebird day: fresh snow then a sunny ski day, today and tomorrow. Its own
  # styled title (a sun rising behind the word), the standard title as fallback.
  - id: bluebird_day
    format: full
    visual: photo
    kpis: [bluebird_day_chance]
    title: { fr: Bluebird, en: Bluebird, es: Bluebird }
    title_style: sunrise
    icon: sun
    webcam: { positions: [summit], min_probability: 0.6 }
    options:
      top: 3
      scene: mountain

  # Live KPIs built from the data already fetched (one category filter each).
  - id: powder_alert
    format: compact
    kpis: [powder_alert_chance]
    title: { fr: Alerte neige, en: Snow alert, es: Alerta de nieve }
    icon: snowflake
    options:
      top: 3

  - id: snowmaking
    format: compact
    kpis: [snowmaking_chance]
    title: { fr: Canons à neige, en: Snow cannons, es: Cañones de nieve }
    icon: snowflake
    options:
      top: 3

  - id: spring_snow
    format: compact
    kpis: [spring_snow_chance]
    title: { fr: Neige de printemps, en: Spring snow, es: Nieve primavera }
    icon: piste
    options:
      top: 3

  - id: hard_snow
    format: compact
    kpis: [hard_snow_chance]
    title: { fr: Neige dure, en: Hard snow, es: Nieve dura }
    icon: piste
    options:
      top: 3

  - id: heavy_snow
    format: compact
    kpis: [heavy_snow_chance]
    title: { fr: Neige lourde, en: Heavy snow, es: Nieve pesada }
    icon: piste
    options:
      top: 3

  - id: easy_conditions
    format: compact
    kpis: [easy_conditions_chance]
    title: { fr: Conditions faciles, en: Easy conditions, es: Condiciones fáciles }
    icon: piste
    options:
      top: 3

  - id: sunset
    format: banner
    visual: photo
    kpis: [sunset_chance]
    title: { fr: Coucher de soleil, en: Sunset, es: Puesta de sol }
    icon: sunset
    options:
      top: 3
      scene: mountain

  - id: starry_night
    format: compact
    kpis: [starry_night_chance]
    title: { fr: Nuit étoilée, en: Starry night, es: Noche estrellada }
    icon: moon
    options:
      top: 3

  - id: sunny_slot
    format: compact
    kpis: [sunny_slot_chance]
    title: { fr: Grand soleil, en: Full sun, es: Pleno sol }
    icon: sun
    options:
      top: 3

  - id: wind_chill
    format: compact
    kpis: [wind_chill_chance]
    title: { fr: Froid ressenti, en: Wind chill, es: Sensación térmica }
    icon: thermometer
    options:
      top: 3

  - id: mild_day
    format: compact
    kpis: [mild_day_chance]
    title: { fr: Journée douce, en: Mild day, es: Día templado }
    icon: sun
    options:
      top: 3

  - id: chains
    format: compact
    kpis: [chains_chance]
    title: { fr: Chaînes nécessaires, en: Chains needed, es: Cadenas necesarias }
    icon: car
    options:
      top: 3

  - id: lift_wind
    format: compact
    kpis: [lift_wind_chance]
    title: { fr: Remontées au vent, en: Lifts in the wind, es: Remontes y viento }
    icon: wind
    options:
      top: 3

  # Avalanche danger: its own styled title, a tilted yellow danger sign with a
  # glint sliding over it (the standard title as fallback).
  - id: avalanche_risk
    format: full
    visual: photo
    title_style: danger_sign
    kpis: [avalanche_risk]
    title: { fr: Risque d'avalanche, en: Avalanche danger, es: Peligro de aludes }
    icon: alert
    options:
      top: 3
      scene: mountain

  - id: wind_slab
    format: compact
    kpis: [wind_slab_chance]
    title: { fr: Neige ventée, en: Wind-blown snow, es: Nieve venteada }
    icon: alert
    options:
      top: 3

  # Rewind 25/26: one tile per historical KPI, shown only under its filter
  # (config/rewinds.yaml finds the Rewind of each KPI). Same tile types as the
  # live KPIs, in the Rewind theme.
  - id: rewind_2025_26_total_snowfall
    format: full
    visual: photo
    kpis: [season_total_snowfall]
    title: { fr: Le plus de neige, en: Most snow, es: Más nieve }
    icon: snowflake
    options:
      scene: snowfall

  - id: rewind_2025_26_longest_snowfall
    format: banner
    visual: photo
    kpis: [season_longest_snowfall]
    title: { fr: La plus longue chute de neige, en: Longest snowfall, es: Nevada más larga }
    icon: snowflake
    options:
      scene: snowfall

  - id: rewind_2025_26_domain_snowfall
    format: banner
    visual: photo
    kpis: [season_domain_snowfall]
    title: { fr: Le plus de neige sur le domaine, en: Most snow on the slopes, es: Más nieve en el dominio }
    icon: piste
    options:
      scene: piste

  - id: rewind_2025_26_offpiste_snowfall
    format: banner
    visual: photo
    kpis: [season_offpiste_snowfall]
    title: { fr: Le plus de neige hors-piste, en: Most off-piste snow, es: Más nieve fuera de pista }
    icon: mountain
    options:
      scene: offpiste

  - id: rewind_2025_26_deep_snow_days
    format: banner
    visual: photo
    kpis: [season_deep_snow_days]
    title: { fr: L'enneigement idéal, en: Ideal snow cover, es: Innivación ideal }
    icon: piste
    options:
      scene: piste

  - id: rewind_2025_26_white_days
    format: banner
    visual: photo
    kpis: [season_white_days]
    title: { fr: Le moins de jours blancs, en: Fewest white days, es: Menos días blancos }
    icon: fog
    options:
      scene: mountain
