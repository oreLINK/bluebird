# yaml-language-server: $schema=./schemas/tiles.schema.json
#
# Tiles are the KPI containers displayed on the page.
#   type:    frontend component, registered in web/src/tiles/registry.ts:
#              banner       betting-app card: banner (photo or illustration),
#                           top stations as odds buttons, "see all" for the rest
#                           (TileBanner.svelte)
#              banner_full  same, with the photo or illustration filling the
#                           whole card behind the title and odds (TileBannerFull)
#              ranking  compact list of every station (TileRanking.svelte)
#   kpis:    KPI ids (config/kpis.yaml) the tile reads. A ranking tile uses one.
#   title:   optional; defaults to the first KPI's name followed by the period.
#            Must contain {period}, replaced by the period label of
#            config/periods.yaml ("Neige {period}" -> "Neige ce soir").
#   periods: optional; the periods to show a tile for (default: every period
#            of its KPIs). The page shows one tile per period not yet over, in
#            chronological order, then in config/layout.yaml order.
#   icon:    optional; one of the icons in web/src/components/Icon.svelte.
#   options: free-form, interpreted by the tile component:
#              banner, banner_full:
#                       top (1-3, default 3), show_odds,
#                       scene (snowfall | piste | offpiste | mountain; default from icon),
#                       photo (none | leader | <path in web/src/assets/photos>);
#                       `leader` shows the photo of the ski area ranked first and
#                       falls back to the illustration when there is none.
#              ranking: visible_rows (default 5), show_odds
#
# Tile order on the page is defined in config/layout.yaml, not here.
tiles:
  - id: snowfall_today
    type: banner_full
    kpis: [snowfall_chance]
    title: { fr: "Neige {period}", en: "Snow {period}" }
    icon: snowflake
    options:
      top: 3
      show_odds: false
      photo: leader
      scene: snowfall

  - id: onpiste_powder
    type: banner
    kpis: [onpiste_powder_chance]
    title: { fr: "Poudreuse sur piste {period}", en: "On-piste powder {period}" }
    icon: piste
    options:
      top: 3
      show_odds: false
      photo: leader
      scene: piste

  - id: offpiste_powder
    type: banner
    kpis: [offpiste_powder_chance]
    title: { fr: "Poudreuse hors-piste {period}", en: "Off-piste powder {period}" }
    icon: mountain
    options:
      top: 3
      show_odds: false
      photo: leader
      scene: offpiste
