# yaml-language-server: $schema=./schemas/kpis.schema.json
#
# KPI registry. Each KPI is computed in the gold layer by the Aggregator class
# registered under `aggregator` (see pipeline/src/bluebird_pipeline/gold/).
# `params` are validated by that Aggregator's `Params` model.
#
# `drivers` describes the explanatory values an Aggregator attaches to each
# result. The frontend shows them, with these labels, when a row is expanded.
# A driver produced by the Aggregator but not listed here is not displayed.
#
# `filters` lists the filter-bar chips (config/filters.yaml) the KPI appears under.
# `periods` lists the periods (config/periods.yaml) a live KPI is computed for:
# one result per station, period and ski day of the horizon.
#
# `kind`: live (default) KPIs are probabilities computed by every refresh (every
# 6 hours), per period. historical KPIs are values over a closed season (cm,
# hours…), computed once by `bluebird rewind` for the Rewinds of
# config/rewinds.yaml; they need `value: {unit, decimals}` (plus `scale` to
# convert the aggregator's unit, e.g. 0.01 for cm -> m, and `max` for the value
# of a full bar, e.g. 100 for a percentage; default: the best value) and are
# never computed by the refresh.
# `method` explains the computation on the back of the tiles; `{param}`
# placeholders are filled with the values of `params`, so text and maths agree.
#
# `visibility` (live KPIs, required by the scored home page of
# config/layout.yaml) sets how the KPI competes for the home page; the score is
# never shown to visitors. README.md "Home page visibility score" has the formula.
#   priority  editorial weight (0..1]: what matters most to a skier
#   measure   value (median of the display driver) or probability (0..1);
#             default: value for a `value` display, probability otherwise
#   floor     below it (mean of the top 3 stations of the chosen place) the
#             tile is not significant and is hidden from the home page
#   strong    at or beyond it the impact is full; below `floor` = lower is
#             stronger (wind chill)
#   alert     optional: at or beyond it the tile is an alert (right after the
#             pinned tiles; Access alerts of tomorrow from noon)
#   slots     optional `floor` / `strong` of the time slots (morning…)
kpis:
  - id: snowfall_chance
    aggregator: snowfall_chance
    filters: [snow]
    periods: [day, morning, midday, afternoon, evening, night]
    visibility: { priority: 1.0, floor: 5, strong: 30, slots: { floor: 2, strong: 15 } }
    name: { fr: Chute de neige, en: Snowfall, es: Nevada }
    description:
      fr: Neige attendue pendant le créneau affiché, à mi-altitude.
      en: Snow expected during the time slot shown, at mid-mountain.
      es: Nieve prevista durante la franja mostrada, a media montaña.
    method:
      fr: >-
        Pour chaque station, Bluebird additionne la neige prévue à mi-altitude pendant
        le créneau (pour la journée entière : de {window_start} à {window_end}) dans
        chacun des 91 scénarios des prévisions d'ensemble (ECMWF et DWD). La tuile
        affiche la médiane : la moitié des scénarios donnent plus, l'autre moitié
        moins. La fiabilité est élevée quand 8 scénarios sur 10 tiennent dans un écart
        de 3 cm.
      en: >-
        For each resort, Bluebird adds up the snow forecast at mid-mountain during the
        time slot (for the whole day: from {window_start} to {window_end}) in each of
        the 91 ensemble forecast scenarios (ECMWF and DWD). The tile shows the median:
        half of the scenarios give more, half give less. Reliability is high when 8
        scenarios out of 10 fall within 3 cm of each other.
      es: >-
        Para cada estación, Bluebird suma la nieve prevista a media montaña durante la
        franja (para el día completo: de {window_start} a {window_end}) en cada uno de
        los 91 escenarios de las predicciones por conjuntos (ECMWF y DWD). La tarjeta
        muestra la mediana: la mitad de los escenarios dan más y la otra mitad menos. La
        fiabilidad es alta cuando 8 escenarios de cada 10 quedan dentro de un margen de
        3 cm.
    params:
      band: mid
      window_start: "08:00"
      window_end: "17:00"
      threshold_cm: 1.0
    display: { kind: value, driver: snow_cm_p50, range: [snow_cm_p10, snow_cm_p90], tolerance: 3 }
    value: { unit: cm, decimals: 0 }
    drivers:
      snow_cm_p10: { label: { fr: Neige – scénario bas, en: Snow – low scenario, es: Nieve – escenario bajo }, unit: cm, decimals: 1 }
      snow_cm_p50: { label: { fr: Neige attendue (médiane), en: Expected snow (median), es: Nieve prevista (mediana) }, unit: cm, decimals: 1 }
      snow_cm_p90: { label: { fr: Neige – scénario haut, en: Snow – high scenario, es: Nieve – escenario alto }, unit: cm, decimals: 1 }
      deterministic_snow_cm: { label: { fr: Neige selon Météo-France, en: Snow per Météo-France, es: Nieve según Météo-France }, unit: cm, decimals: 1 }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: offpiste_powder_chance
    aggregator: offpiste_powder_chance
    filters: [snow-quality]
    periods: [day, morning, midday, afternoon]
    visibility: { priority: 0.9, floor: 0.3, strong: 0.7 }
    name: { fr: Poudreuse hors-piste, en: Off-piste powder, es: Nieve polvo fuera de pista }
    description:
      fr: Probabilité de trouver de la poudreuse fraîche hors-piste au début du créneau, au sommet.
      en: Probability of fresh off-piste powder at the start of the time slot, near the summit.
      es: Probabilidad de encontrar nieve polvo fresca fuera de pista al inicio de la franja, en la cima.
    method:
      fr: >-
        Pour chaque scénario, au sommet : la neige des {lookback_hours} heures avant
        le début du créneau (au plus tôt l'ouverture des remontées) doit atteindre
        {threshold_cm} cm. Le score baisse avec le vent
        des {wind_lookback_hours} dernières heures (au-delà de {wind_ok_kmh} km/h, la
        neige est soufflée) et en cas de redoux au-dessus de {thaw_temp_c} °C. La
        probabilité est le score moyen des scénarios.
      en: >-
        For each scenario, near the summit: snow over the {lookback_hours} hours
        before the time slot starts (lifts opening at the earliest) must reach
        {threshold_cm} cm. The score drops with wind
        over the last {wind_lookback_hours} hours (above {wind_ok_kmh} km/h, snow
        is blown away) and with a thaw above {thaw_temp_c} °C. The probability is
        the average score of the scenarios.
      es: >-
        Para cada escenario, en la cima: la nieve de las {lookback_hours} horas
        anteriores al inicio de la franja (como pronto, la apertura de los remontes)
        debe alcanzar {threshold_cm} cm. La puntuación baja con el viento de las últimas
        {wind_lookback_hours} horas (por encima de {wind_ok_kmh} km/h, el viento se
        lleva la nieve) y con un deshielo por encima de {thaw_temp_c} °C. La
        probabilidad es la puntuación media de los escenarios.
    params:
      band: summit
      lookback_hours: 36
      threshold_cm: 15.0
      wind_lookback_hours: 12
      wind_ok_kmh: 25.0
      wind_bad_kmh: 60.0
      wind_floor: 0.3
      thaw_lookback_hours: 12
      thaw_temp_c: 0.5
      thaw_factor: 0.3
    drivers:
      new_snow_cm_p50: { label: { fr: Neige fraîche (médiane), en: Fresh snow (median), es: Nieve fresca (mediana) }, unit: cm, decimals: 0 }
      max_wind_kmh_p50: { label: { fr: Vent max récent, en: Recent max wind, es: Viento máx. reciente }, unit: km/h, decimals: 0 }
      max_temp_c_p50: { label: { fr: Température max récente, en: Recent max temperature, es: Temperatura máx. reciente }, unit: °C, decimals: 1 }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: onpiste_powder_chance
    aggregator: onpiste_powder_chance
    filters: [snow-quality]
    periods: [day, morning, midday, afternoon]
    visibility: { priority: 0.95, floor: 5, strong: 20 }
    name: { fr: Poudreuse sur piste, en: On-piste powder, es: Nieve polvo en pista }
    description:
      fr: Neige tombée sur les pistes depuis la fin du damage, au début du créneau, à mi-altitude.
      en: Snow fallen on the pistes since grooming ended, at the start of the time slot, at mid-mountain.
      es: Nieve caída en las pistas desde el final del pisado, al inicio de la franja, a media montaña.
    method:
      fr: >-
        Pour chaque station, Bluebird additionne la neige prévue entre la fin du
        damage et le début du créneau (au plus tôt l'ouverture des remontées), à
        mi-altitude, dans chacun des 91 scénarios. La tuile affiche la médiane : la
        moitié des scénarios donnent plus, l'autre moitié moins. Les pistes damées
        sont recouvertes de poudreuse à partir de {threshold_cm} cm. La fiabilité est
        élevée quand 8 scénarios sur 10 tiennent dans un écart de 4 cm.
      en: >-
        For each resort, Bluebird adds up the snow forecast between the end of
        grooming and the start of the time slot (lifts opening at the earliest), at
        mid-mountain, in each of the 91 scenarios. The tile shows the median: half of
        the scenarios give more, half give less. The groomed pistes are covered with
        powder from {threshold_cm} cm. Reliability is high when 8 scenarios out of 10
        fall within 4 cm of each other.
      es: >-
        Para cada estación, Bluebird suma la nieve prevista entre el final del pisado y
        el inicio de la franja (como pronto, la apertura de los remontes), a media
        montaña, en cada uno de los 91 escenarios. La tarjeta muestra la mediana: la
        mitad de los escenarios dan más y la otra mitad menos. Las pistas pisadas quedan
        cubiertas de nieve polvo a partir de {threshold_cm} cm. La fiabilidad es alta
        cuando 8 escenarios de cada 10 quedan dentro de un margen de 4 cm.
    params:
      band: mid
      threshold_cm: 5.0
    display: { kind: value, driver: snow_after_grooming_cm_p50, range: [snow_after_grooming_cm_p10, snow_after_grooming_cm_p90], tolerance: 4 }
    value: { unit: cm, decimals: 0 }
    drivers:
      snow_after_grooming_cm_p10: { label: { fr: Neige depuis le damage – scénario bas, en: Snow since grooming – low scenario, es: Nieve desde el pisado – escenario bajo }, unit: cm, decimals: 1 }
      snow_after_grooming_cm_p50: { label: { fr: Neige depuis le damage (médiane), en: Snow since grooming (median), es: Nieve desde el pisado (mediana) }, unit: cm, decimals: 1 }
      snow_after_grooming_cm_p90: { label: { fr: Neige depuis le damage – scénario haut, en: Snow since grooming – high scenario, es: Nieve desde el pisado – escenario alto }, unit: cm, decimals: 1 }
      window_hours: { label: { fr: Durée depuis le damage, en: Hours since grooming, es: Tiempo desde el pisado }, unit: h }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: whiteout_chance
    aggregator: whiteout_chance
    filters: [sky]
    periods: [day]   # a white *day*: today and tomorrow
    visibility: { priority: 0.75, floor: 0.4, strong: 0.8 }
    name: { fr: Jour blanc, en: White day, es: Día blanco }
    description:
      fr: Probabilité d'un jour blanc (sans relief visible) pendant la journée de ski, à mi-altitude.
      en: Probability of a white day (no visible relief) during the ski day, at mid-mountain.
      es: Probabilidad de un día blanco (sin relieve visible) durante la jornada de esquí, a media montaña.
    method:
      fr: >-
        Pour chacun des 91 scénarios, Bluebird regarde chaque heure skiable
        ({ski_start}–{ski_end}) à mi-altitude. Une heure est blanche si la station est
        dans le nuage (humidité ≥ {rh_min_pct} % et nuages bas ≥ {low_cloud_min_pct} %),
        s'il neige au moins {snowfall_min_cm_h} cm/h, ou si la lumière est plate
        (rayonnement solaire sous {clear_sky_index_max} fois celui d'un ciel clair).
        Le jour est blanc dès {min_white_hours} heures blanches ; la probabilité est
        la part des scénarios qui le donnent blanc.
      en: >-
        For each of the 91 scenarios, Bluebird checks every ski hour
        ({ski_start}–{ski_end}) at mid-mountain. An hour is white when the resort is
        in the cloud (humidity ≥ {rh_min_pct} % and low cloud ≥ {low_cloud_min_pct} %),
        when at least {snowfall_min_cm_h} cm/h of snow falls, or in flat light
        (sunlight below {clear_sky_index_max} times a clear sky's). The day is
        white from {min_white_hours} white hours; the probability is the share of
        scenarios giving a white day.
      es: >-
        Para cada uno de los 91 escenarios, Bluebird revisa cada hora esquiable
        ({ski_start}–{ski_end}) a media montaña. Una hora es blanca si la estación está
        dentro de la nube (humedad ≥ {rh_min_pct} % y nubes bajas ≥ {low_cloud_min_pct}
        %), si nieva al menos {snowfall_min_cm_h} cm/h o si la luz es plana (radiación
        solar inferior a {clear_sky_index_max} veces la de un cielo despejado). El día
        es blanco a partir de {min_white_hours} horas blancas; la probabilidad es la
        proporción de escenarios que lo dan blanco.
    params:
      band: mid
      ski_start: "09:00"
      ski_end: "17:00"
      rh_min_pct: 98
      low_cloud_min_pct: 90
      snowfall_min_cm_h: 0.5
      clear_sky_index_max: 0.3
      min_white_hours: 6
    drivers:
      white_hours_p50: { label: { fr: Heures blanches (médiane), en: White hours (median), es: Horas blancas (mediana) }, unit: h }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: bluebird_day_chance
    aggregator: bluebird_day_chance
    filters: [sky]
    periods: [day]   # a bluebird *day*: today and tomorrow
    visibility: { priority: 1.0, floor: 0.25, strong: 0.7 }
    name: { fr: Journée bluebird, en: Bluebird day, es: Día bluebird }
    description:
      fr: Probabilité d'une journée de grand beau juste après une chute de neige, à mi-altitude.
      en: Probability of a clear, sunny ski day right after a snowfall, at mid-mountain.
      es: Probabilidad de un día despejado y soleado justo después de una nevada, a media montaña.
    method:
      fr: >-
        Pour chacun des 91 scénarios, Bluebird additionne la neige tombée à
        mi-altitude dans les {lookback_hours} heures avant {ski_start} : il en faut
        au moins {threshold_cm} cm. Puis il regarde chaque heure skiable
        ({ski_start}–{ski_end}) : une heure est ensoleillée si les nuages couvrent au
        plus {cloud_max_pct} % du ciel et si le rayonnement solaire atteint
        {clear_sky_index_min} fois celui d'un ciel clair. Il faut au moins
        {min_sunny_hours} heures ensoleillées ; la probabilité est la part des
        scénarios qui réunissent les deux.
      en: >-
        For each of the 91 scenarios, Bluebird adds up the snow fallen at
        mid-mountain in the {lookback_hours} hours before {ski_start}: at least
        {threshold_cm} cm are needed. Then it checks every ski hour
        ({ski_start}–{ski_end}): an hour is sunny when clouds cover at most
        {cloud_max_pct} % of the sky and sunlight reaches {clear_sky_index_min}
        times a clear sky's. At least {min_sunny_hours} sunny hours are needed; the
        probability is the share of scenarios meeting both.
      es: >-
        Para cada uno de los 91 escenarios, Bluebird suma la nieve caída a media montaña
        en las {lookback_hours} horas anteriores a las {ski_start}: hacen falta al menos
        {threshold_cm} cm. Después revisa cada hora esquiable ({ski_start}–{ski_end}):
        una hora es soleada si las nubes cubren como mucho el {cloud_max_pct} % del
        cielo y la radiación solar alcanza {clear_sky_index_min} veces la de un cielo
        despejado. Hacen falta al menos {min_sunny_hours} horas soleadas; la
        probabilidad es la proporción de escenarios que cumplen ambas condiciones.
    params:
      band: mid
      lookback_hours: 36
      threshold_cm: 15.0
      ski_start: "09:00"
      ski_end: "17:00"
      cloud_max_pct: 30
      clear_sky_index_min: 0.6
      min_sunny_hours: 6
    drivers:
      new_snow_cm_p50: { label: { fr: Neige fraîche (médiane), en: Fresh snow (median), es: Nieve fresca (mediana) }, unit: cm }
      sunny_hours_p50: { label: { fr: Heures ensoleillées (médiane), en: Sunny hours (median), es: Horas soleadas (mediana) }, unit: h }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  # ----------------------------------------------------- more live KPIs
  # Built only from the data already fetched (ensemble at mid-mountain and
  # summit); one category filter each (config/filters.yaml).

  # ❄️ Snow
  - id: powder_alert_chance
    aggregator: powder_alert_chance
    filters: [snow]
    periods: [day]
    visibility: { priority: 1.0, floor: 20, strong: 50 }
    name: { fr: Alerte neige, en: Snow alert, es: Alerta de nieve }
    description:
      fr: Neige attendue à mi-altitude sur 36 heures à partir du matin.
      en: Snow expected at mid-mountain over 36 hours from the morning.
      es: Nieve prevista a media montaña durante 36 horas a partir de la mañana.
    method:
      fr: >-
        Pour chacun des 91 scénarios, Bluebird additionne la neige prévue à
        mi-altitude pendant {hours} heures à partir de {start}. La tuile affiche la
        médiane : la moitié des scénarios donnent plus, l'autre moitié moins. L'alerte
        commence à {threshold_cm} cm. La fiabilité est élevée quand 8 scénarios sur 10
        tiennent dans un écart de 15 cm.
      en: >-
        For each of the 91 scenarios, Bluebird adds up the snow forecast at
        mid-mountain over {hours} hours from {start}. The tile shows the median: half
        of the scenarios give more, half give less. The alert starts at {threshold_cm}
        cm. Reliability is high when 8 scenarios out of 10 fall within 15 cm of each
        other.
      es: >-
        Para cada uno de los 91 escenarios, Bluebird suma la nieve prevista a media
        montaña durante {hours} horas a partir de las {start}. La tarjeta muestra la
        mediana: la mitad de los escenarios dan más y la otra mitad menos. La alerta
        empieza a partir de {threshold_cm} cm. La fiabilidad es alta cuando 8 escenarios
        de cada 10 quedan dentro de un margen de 15 cm.
    params:
      band: mid
      start: "06:00"
      hours: 36
      threshold_cm: 30.0
    display:
      kind: value
      driver: snow_cm_p50
      range: [snow_cm_p10, snow_cm_p90]
      tolerance: 15
      bands:
        - { max: 10, label: { fr: faible, en: light, es: escasa } }
        - { max: 29, label: { fr: bonne, en: good, es: buena } }
        - { label: { fr: alerte, en: alert, es: alerta } }
    value: { unit: cm, decimals: 0 }
    drivers:
      snow_cm_p10: { label: { fr: Neige – scénario bas, en: Snow – low scenario, es: Nieve – escenario bajo }, unit: cm }
      snow_cm_p50: { label: { fr: Neige attendue (médiane), en: Expected snow (median), es: Nieve prevista (mediana) }, unit: cm }
      snow_cm_p90: { label: { fr: Neige – scénario haut, en: Snow – high scenario, es: Nieve – escenario alto }, unit: cm }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: snowmaking_chance
    aggregator: snowmaking_chance
    filters: [snow]
    periods: [overnight, night]
    visibility: { priority: 0.45, floor: 3, strong: 8 }
    name: { fr: Canons à neige, en: Snow cannons, es: Cañones de nieve }
    description:
      fr: Heures de la nuit assez froides et sèches pour fabriquer de la neige sur les pistes.
      en: Hours of the night cold and dry enough to make snow on the pistes.
      es: Horas de la noche lo bastante frías y secas para fabricar nieve en las pistas.
    method:
      fr: >-
        Les canons ont besoin d'une température humide (qui tient compte de l'humidité
        de l'air) basse. Pour chacun des 91 scénarios, Bluebird compte les heures de
        {evening_start} à 06:00 où elle est à {wet_bulb_max_c} °C ou moins, à
        mi-altitude. La tuile affiche la médiane : la moitié des scénarios donnent
        plus, l'autre moitié moins. Une nuit utile pour les canons en compte au moins
        {min_hours}. La fiabilité est élevée quand 8 scénarios sur 10 tiennent dans un
        écart de 3 heures.
      en: >-
        Snow cannons need a low wet-bulb temperature (which takes the air's humidity
        into account). For each of the 91 scenarios, Bluebird counts the hours from
        {evening_start} to 06:00 when it is at {wet_bulb_max_c} °C or below, at
        mid-mountain. The tile shows the median: half of the scenarios give more, half
        give less. A useful night for the cannons has at least {min_hours}.
        Reliability is high when 8 scenarios out of 10 fall within 3 hours of each
        other.
      es: >-
        Los cañones necesitan una temperatura de bulbo húmedo baja (que tiene en cuenta
        la humedad del aire). Para cada uno de los 91 escenarios, Bluebird cuenta las
        horas de las {evening_start} a las 06:00 en las que está a {wet_bulb_max_c} °C o
        menos, a media montaña. La tarjeta muestra la mediana: la mitad de los
        escenarios dan más y la otra mitad menos. Una noche útil para los cañones tiene
        al menos {min_hours}. La fiabilidad es alta cuando 8 escenarios de cada 10
        quedan dentro de un margen de 3 horas.
    params:
      band: mid
      evening_start: "20:00"
      wet_bulb_max_c: -2.5
      min_hours: 6
    display: { kind: value, driver: cold_hours_p50, range: [cold_hours_p10, cold_hours_p90], tolerance: 3 }
    value: { unit: h, decimals: 0 }
    drivers:
      cold_hours_p10: { label: { fr: Heures favorables – scénario bas, en: Suitable hours – low scenario, es: Horas favorables – escenario bajo }, unit: h }
      cold_hours_p90: { label: { fr: Heures favorables – scénario haut, en: Suitable hours – high scenario, es: Horas favorables – escenario alto }, unit: h }
      cold_hours_p50: { label: { fr: Heures favorables (médiane), en: Suitable hours (median), es: Horas favorables (mediana) }, unit: h }
      wet_bulb_min_c_p50: { label: { fr: Température humide minimale (médiane), en: Lowest wet-bulb temperature (median), es: Temperatura de bulbo húmedo mínima (mediana) }, unit: °C, decimals: 1 }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  # 🎿 Snow quality
  - id: spring_snow_chance
    aggregator: spring_snow_chance
    filters: [snow-quality]
    periods: [day, morning, midday, afternoon]
    visibility: { priority: 0.7, floor: 0.4, strong: 0.8 }
    name: { fr: Neige de printemps, en: Spring snow, es: Nieve primavera }
    description:
      fr: Probabilité d'une neige transformée qui ramollit pendant le créneau après avoir regelé la nuit.
      en: Probability of corn snow softening during the time slot after a night freeze.
      es: Probabilidad de una nieve transformada que se ablanda durante la franja tras haberse vuelto a helar por la noche.
    method:
      fr: >-
        Pour chacun des 91 scénarios, à mi-altitude : la neige a regelé (au plus
        {freeze_max_c} °C entre {freeze_start} et {freeze_end}), elle ramollit pendant le
        créneau (au moins {soften_min_c} °C) et moins de {fresh_snow_max_cm} cm de neige
        fraîche la recouvrent ({fresh_snow_hours} dernières heures). La probabilité
        est la part des scénarios qui réunissent les trois.
        Pour la journée entière, la fenêtre va de {ski_start} à {ski_end}.
      en: >-
        For each of the 91 scenarios, at mid-mountain: the snow refroze (at most
        {freeze_max_c} °C between {freeze_start} and {freeze_end}), it softens during
        the slot (at least {soften_min_c} °C) and less than {fresh_snow_max_cm} cm of
        fresh snow covers it (last {fresh_snow_hours} hours). The probability is the
        share of scenarios meeting all three.
        For the whole day, the window runs from {ski_start} to {ski_end}.
      es: >-
        Para cada uno de los 91 escenarios, a media montaña: la nieve se ha vuelto a
        helar (como mucho {freeze_max_c} °C entre las {freeze_start} y las
        {freeze_end}), se ablanda durante la franja (al menos {soften_min_c} °C) y la
        cubren menos de {fresh_snow_max_cm} cm de nieve fresca (últimas
        {fresh_snow_hours} horas). La probabilidad es la proporción de escenarios que
        cumplen las tres condiciones. Para el día completo, la ventana va de las
        {ski_start} a las {ski_end}.
    params:
      ski_start: "09:00"
      ski_end: "17:00"
      band: mid
      freeze_start: "00:00"
      freeze_end: "08:00"
      freeze_max_c: -1.0
      soften_min_c: 1.0
      fresh_snow_hours: 24
      fresh_snow_max_cm: 5.0
    drivers:
      night_min_c_p50: { label: { fr: Minimum de la nuit (médiane), en: Night minimum (median), es: Mínima de la noche (mediana) }, unit: °C, decimals: 1 }
      slot_max_c_p50: { label: { fr: Maximum du créneau (médiane), en: Slot maximum (median), es: Máxima de la franja (mediana) }, unit: °C, decimals: 1 }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: hard_snow_chance
    aggregator: hard_snow_chance
    filters: [snow-quality]
    periods: [day, morning]
    visibility: { priority: 0.7, floor: 0.25, strong: 0.6 }
    name: { fr: Neige dure, en: Hard snow, es: Nieve dura }
    description:
      fr: Probabilité d'une neige dure et glacée le matin, après un redoux la veille et un regel la nuit.
      en: Probability of hard, icy snow in the morning after a thaw the day before and a night freeze.
      es: Probabilidad de una nieve dura y helada por la mañana, tras un deshielo la víspera y una helada nocturna.
    method:
      fr: >-
        Pour chacun des 91 scénarios, à mi-altitude : la neige a fondu la veille
        (au moins {melt_min_c} °C entre {melt_start} et {melt_end}), elle a regelé (au plus
        {freeze_max_c} °C ensuite), elle reste gelée pendant le créneau (au plus
        {frozen_max_c} °C) et moins de {fresh_snow_max_cm} cm de neige fraîche la recouvrent.
        La probabilité est la part des scénarios qui réunissent les quatre.
        La tuile affiche « Oui » à partir de 60 %, « Possible » à partir de 25 %, sinon « Non ».
        Pour la journée entière, la fenêtre va de {ski_start} à {ski_end}.
      en: >-
        For each of the 91 scenarios, at mid-mountain: the snow melted the day
        before (at least {melt_min_c} °C between {melt_start} and {melt_end}), it refroze
        (at most {freeze_max_c} °C afterwards), it stays frozen during the slot (at most
        {frozen_max_c} °C) and less than {fresh_snow_max_cm} cm of fresh snow covers it.
        The probability is the share of scenarios meeting all four.
        The tile shows "Yes" from 60 %, "Possible" from 25 %, otherwise "No".
        For the whole day, the window runs from {ski_start} to {ski_end}.
      es: >-
        Para cada uno de los 91 escenarios, a media montaña: la nieve se fundió la
        víspera (al menos {melt_min_c} °C entre las {melt_start} y las {melt_end}), se
        volvió a helar (como mucho {freeze_max_c} °C después), sigue helada durante la
        franja (como mucho {frozen_max_c} °C) y la cubren menos de {fresh_snow_max_cm}
        cm de nieve fresca. La probabilidad es la proporción de escenarios que cumplen
        las cuatro condiciones. La tarjeta muestra «Sí» a partir del 60 %, «Posible» a
        partir del 25 % y, si no, «No». Para el día completo, la ventana va de las
        {ski_start} a las {ski_end}.
    params:
      ski_start: "09:00"
      ski_end: "11:00"
      band: mid
      melt_start: "11:00"
      melt_end: "17:00"
      melt_min_c: 2.0
      freeze_max_c: -2.0
      frozen_max_c: 0.0
      fresh_snow_max_cm: 2.0
    display:
      kind: levels
      levels:
        - { min: 0.6, label: { fr: Oui, en: "Yes", es: Sí } }
        - { min: 0.25, label: { fr: Possible, en: Possible, es: Posible } }
        - { min: 0, label: { fr: Non, en: "No", es: "No" } }
    drivers:
      melt_max_c_p50: { label: { fr: Maximum de la veille (médiane), en: Previous day's maximum (median), es: Máxima de la víspera (mediana) }, unit: °C, decimals: 1 }
      night_min_c_p50: { label: { fr: Minimum de la nuit (médiane), en: Night minimum (median), es: Mínima de la noche (mediana) }, unit: °C, decimals: 1 }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: heavy_snow_chance
    aggregator: heavy_snow_chance
    filters: [snow-quality]
    periods: [day, midday, afternoon]
    visibility: { priority: 0.6, floor: 0.4, strong: 0.8 }
    name: { fr: Neige lourde, en: Heavy snow, es: Nieve pesada }
    description:
      fr: Probabilité d'une neige lourde et collante pendant le créneau (redoux ou neige mouillée).
      en: Probability of heavy, sticky snow during the time slot (warm spell or wet snowfall).
      es: Probabilidad de una nieve pesada y pegajosa durante la franja (subida de temperaturas o nieve húmeda).
    method:
      fr: >-
        Pour chacun des 91 scénarios, à mi-altitude, le créneau est lourd si la
        température atteint {warm_min_c} °C, ou s'il tombe au moins {wet_snow_min_cm} cm de
        neige à {wet_snow_min_c} °C ou plus. La probabilité est la part des scénarios qui
        le donnent.
        Pour la journée entière, la fenêtre va de {ski_start} à {ski_end}.
      en: >-
        For each of the 91 scenarios, at mid-mountain, the slot is heavy when the
        temperature reaches {warm_min_c} °C, or when at least {wet_snow_min_cm} cm of snow
        falls at {wet_snow_min_c} °C or more. The probability is the share of scenarios
        giving it.
        For the whole day, the window runs from {ski_start} to {ski_end}.
      es: >-
        Para cada uno de los 91 escenarios, a media montaña, la franja es pesada si la
        temperatura alcanza {warm_min_c} °C, o si caen al menos {wet_snow_min_cm} cm de
        nieve a {wet_snow_min_c} °C o más. La probabilidad es la proporción de
        escenarios que lo indican. Para el día completo, la ventana va de las
        {ski_start} a las {ski_end}.
    params:
      ski_start: "11:00"
      ski_end: "17:00"
      band: mid
      warm_min_c: 4.0
      wet_snow_min_c: 0.5
      wet_snow_min_cm: 1.0
    drivers:
      max_temp_c_p50: { label: { fr: Maximum du créneau (médiane), en: Slot maximum (median), es: Máxima de la franja (mediana) }, unit: °C, decimals: 1 }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: easy_conditions_chance
    aggregator: easy_conditions_chance
    filters: [snow-quality]
    periods: [day, morning, midday, afternoon]
    visibility: { priority: 0.55, floor: 0.5, strong: 0.9 }
    name: { fr: Conditions faciles, en: Easy conditions, es: Condiciones fáciles }
    description:
      fr: Probabilité de conditions faciles pour débuter pendant le créneau, à mi-altitude.
      en: Probability of easy conditions for beginners during the time slot, at mid-mountain.
      es: Probabilidad de condiciones fáciles para principiantes durante la franja, a media montaña.
    method:
      fr: >-
        Pour chacun des 91 scénarios, à mi-altitude, le créneau est facile si le vent
        reste sous {wind_max_kmh} km/h, la température au-dessus de {temp_min_c} °C, s'il
        tombe moins de {snowfall_max_cm} cm de neige et si au plus {white_share_max_pct} % des
        heures sont blanches (même règle que le jour blanc). La probabilité est la
        part des scénarios qui le donnent.
        Pour la journée entière, la fenêtre va de {ski_start} à {ski_end}.
      en: >-
        For each of the 91 scenarios, at mid-mountain, the slot is easy when the wind
        stays below {wind_max_kmh} km/h, the temperature above {temp_min_c} °C, less than
        {snowfall_max_cm} cm of snow falls and at most {white_share_max_pct} % of its hours are
        white (same rule as the white day). The probability is the share of
        scenarios giving it.
        For the whole day, the window runs from {ski_start} to {ski_end}.
      es: >-
        Para cada uno de los 91 escenarios, a media montaña, la franja es fácil si el
        viento se mantiene por debajo de {wind_max_kmh} km/h, la temperatura por encima
        de {temp_min_c} °C, caen menos de {snowfall_max_cm} cm de nieve y como mucho el
        {white_share_max_pct} % de sus horas son blancas (misma regla que el día
        blanco). La probabilidad es la proporción de escenarios que lo indican. Para el
        día completo, la ventana va de las {ski_start} a las {ski_end}.
    params:
      ski_start: "09:00"
      ski_end: "17:00"
      band: mid
      wind_max_kmh: 25
      temp_min_c: -10
      snowfall_max_cm: 2.0
      white_share_max_pct: 25
    drivers:
      max_wind_kmh_p50: { label: { fr: Vent maximal (médiane), en: Maximum wind (median), es: Viento máximo (mediana) }, unit: km/h }
      min_temp_c_p50: { label: { fr: Minimum du créneau (médiane), en: Slot minimum (median), es: Mínima de la franja (mediana) }, unit: °C, decimals: 1 }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  # ☀️ Sky
  - id: sunset_chance
    aggregator: sunset_chance
    filters: [sky]
    periods: [sunset]
    visibility: { priority: 0.5, floor: 0.5, strong: 0.9 }
    name: { fr: Coucher de soleil, en: Sunset, es: Puesta de sol }
    description:
      fr: Probabilité d'un coucher de soleil visible depuis le haut du domaine skiable.
      en: Probability of a visible sunset from the top of the ski area.
      es: Probabilidad de una puesta de sol visible desde lo alto del dominio esquiable.
    method:
      fr: >-
        Bluebird calcule l'heure du coucher du soleil pour chaque station (horizon
        plat : les crêtes à l'ouest le cachent plus tôt). Pour chacun des 91 scénarios,
        près du sommet, les nuages doivent couvrir en moyenne au plus {cloud_max_pct} %
        du ciel de {hours_before} h avant à {hours_after} h après. La probabilité est la
        part des scénarios qui le donnent.
      en: >-
        Bluebird computes the sunset time for each resort (flat horizon: ridges to
        the west hide it earlier). For each of the 91 scenarios, near the summit,
        clouds must cover at most {cloud_max_pct} % of the sky on average from
        {hours_before} h before to {hours_after} h after. The probability is the share of
        scenarios giving it.
      es: >-
        Bluebird calcula la hora de la puesta de sol para cada estación (horizonte
        plano: las crestas al oeste la ocultan antes). Para cada uno de los 91
        escenarios, cerca de la cima, las nubes deben cubrir de media como mucho el
        {cloud_max_pct} % del cielo desde {hours_before} h antes hasta {hours_after} h
        después. La probabilidad es la proporción de escenarios que lo indican.
    params:
      band: summit
      hours_before: 1
      hours_after: 1
      cloud_max_pct: 40
    display: { kind: percent, note: sunset_time }
    drivers:
      sunset_time: { label: { fr: Coucher du soleil, en: Sunset time, es: Hora de la puesta de sol } }
      cloud_pct_p50: { label: { fr: Nuages (médiane), en: Cloud cover (median), es: Nubosidad (mediana) }, unit: "%" }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: starry_night_chance
    aggregator: starry_night_chance
    filters: [sky]
    periods: [sunset, evening]
    visibility: { priority: 0.4, floor: 0.5, strong: 0.9 }
    name: { fr: Nuit étoilée, en: Starry night, es: Noche estrellada }
    description:
      fr: Probabilité d'un ciel dégagé et étoilé en soirée.
      en: Probability of a clear, starry sky in the evening.
      es: Probabilidad de un cielo despejado y estrellado por la noche.
    method:
      fr: >-
        Pour chacun des 91 scénarios, près du sommet, Bluebird compte les heures de
        la soirée où les nuages couvrent au plus {cloud_max_pct} % du ciel. La nuit est
        étoilée dès {min_clear_hours} heures dégagées ; la probabilité est la part des
        scénarios qui le donnent.
        Pour « ce soir », la soirée va de {evening_start} à {evening_end}.
      en: >-
        For each of the 91 scenarios, near the summit, Bluebird counts the evening
        hours with clouds covering at most {cloud_max_pct} % of the sky. The night is
        starry from {min_clear_hours} clear hours; the probability is the share of
        scenarios giving it.
        For "tonight", the evening runs from {evening_start} to {evening_end}.
      es: >-
        Para cada uno de los 91 escenarios, cerca de la cima, Bluebird cuenta las horas
        de la noche en las que las nubes cubren como mucho el {cloud_max_pct} % del
        cielo. La noche es estrellada a partir de {min_clear_hours} horas despejadas; la
        probabilidad es la proporción de escenarios que lo indican. Para «esta noche»,
        la noche va de las {evening_start} a las {evening_end}.
    params:
      evening_start: "18:00"
      evening_end: "00:00"
      band: summit
      cloud_max_pct: 20
      min_clear_hours: 4
    drivers:
      clear_hours_p50: { label: { fr: Heures dégagées (médiane), en: Clear hours (median), es: Horas despejadas (mediana) }, unit: h }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: sunny_slot_chance
    aggregator: sunny_slot_chance
    filters: [sky]
    periods: [day, morning, midday, afternoon]
    visibility: { priority: 0.75, measure: probability, floor: 0.5, strong: 0.9 }
    name: { fr: Grand soleil, en: Full sun, es: Pleno sol }
    description:
      fr: Heures de soleil pendant le créneau, à mi-altitude.
      en: Hours of sunshine during the time slot, at mid-mountain.
      es: Horas de sol durante la franja, a media montaña.
    method:
      fr: >-
        Pour chacun des 91 scénarios, à mi-altitude, une heure est ensoleillée si les
        nuages couvrent au plus {cloud_max_pct} % du ciel et si le rayonnement atteint
        {clear_sky_index_min} fois celui d'un ciel clair ; les heures avant le lever
        ou après le coucher du soleil ne comptent pas. La tuile affiche la médiane des
        heures ensoleillées du créneau. La fiabilité est élevée quand 8 scénarios sur
        10 tiennent dans un écart de 2 heures.
        Pour la journée entière, la fenêtre va de {ski_start} à {ski_end}.
      en: >-
        For each of the 91 scenarios, at mid-mountain, an hour is sunny when clouds
        cover at most {cloud_max_pct} % of the sky and sunlight reaches
        {clear_sky_index_min} times a clear sky's; hours before sunrise or after
        sunset do not count. The tile shows the median number of sunny hours in the
        slot. Reliability is high when 8 scenarios out of 10 fall within 2 hours of
        each other.
        For the whole day, the window runs from {ski_start} to {ski_end}.
      es: >-
        Para cada uno de los 91 escenarios, a media montaña, una hora es soleada si las
        nubes cubren como mucho el {cloud_max_pct} % del cielo y la radiación alcanza
        {clear_sky_index_min} veces la de un cielo despejado; las horas antes del
        amanecer o después de la puesta de sol no cuentan. La tarjeta muestra la mediana
        de horas soleadas de la franja. La fiabilidad es alta cuando 8 escenarios de
        cada 10 quedan dentro de un margen de 2 horas. Para el día completo, la ventana
        va de las {ski_start} a las {ski_end}.
    params:
      ski_start: "09:00"
      ski_end: "17:00"
      band: mid
      cloud_max_pct: 30
      clear_sky_index_min: 0.6
      sunny_share_min_pct: 75
    display: { kind: value, driver: sunny_hours_p50, range: [sunny_hours_p10, sunny_hours_p90], tolerance: 2 }
    value: { unit: h, decimals: 0 }
    drivers:
      sunny_hours_p10: { label: { fr: Heures de soleil – scénario bas, en: Sunny hours – low scenario, es: Horas de sol – escenario bajo }, unit: h }
      sunny_hours_p50: { label: { fr: Heures de soleil (médiane), en: Sunny hours (median), es: Horas de sol (mediana) }, unit: h }
      sunny_hours_p90: { label: { fr: Heures de soleil – scénario haut, en: Sunny hours – high scenario, es: Horas de sol – escenario alto }, unit: h }
      sunny_pct_p50: { label: { fr: Part ensoleillée (médiane), en: Sunny share (median), es: Proporción soleada (mediana) }, unit: "%" }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  # 🧣 Comfort
  - id: wind_chill_chance
    aggregator: wind_chill_chance
    filters: [comfort]
    periods: [day, morning, midday, afternoon]
    visibility: { priority: 0.7, floor: -15, strong: -30, alert: -28 }
    name: { fr: Froid ressenti, en: Wind chill, es: Sensación térmica }
    description:
      fr: Température ressentie la plus froide au sommet pendant le créneau, à cause du vent.
      en: Coldest felt temperature at the summit during the time slot, because of the wind.
      es: Temperatura percibida más fría en la cima durante la franja, a causa del viento.
    method:
      fr: >-
        Pour chacun des 91 scénarios, près du sommet, Bluebird calcule heure par heure
        la température ressentie (indice de refroidissement éolien, qui combine
        température et vent) et garde la plus froide du créneau. La tuile affiche la
        médiane et le risque selon l'échelle d'Environnement Canada : faible au-dessus
        de −10 °C, modéré jusqu'à −27 °C, élevé jusqu'à −39 °C (gelures en 10 à 30
        minutes), très élevé jusqu'à −47 °C, grave jusqu'à −54 °C, extrême au-delà. La
        fiabilité est élevée quand 8 scénarios sur 10 tiennent dans un écart de 6 °C.
        Pour la journée entière, la fenêtre va de {ski_start} à {ski_end}.
      en: >-
        For each of the 91 scenarios, near the summit, Bluebird computes the felt
        temperature hour by hour (wind chill index, combining temperature and wind)
        and keeps the coldest of the slot. The tile shows the median and the risk on
        Environment Canada's scale: low above −10 °C, moderate down to −27 °C, high
        down to −39 °C (frostbite in 10 to 30 minutes), very high down to −47 °C,
        severe down to −54 °C, extreme below. Reliability is high when 8 scenarios out
        of 10 fall within 6 °C of each other.
        For the whole day, the window runs from {ski_start} to {ski_end}.
      es: >-
        Para cada uno de los 91 escenarios, cerca de la cima, Bluebird calcula hora a
        hora la sensación térmica (índice de enfriamiento por viento, que combina
        temperatura y viento) y se queda con la más fría de la franja. La tarjeta
        muestra la mediana y el riesgo según la escala de Environment Canada: bajo por
        encima de −10 °C, moderado hasta −27 °C, alto hasta −39 °C (congelación en 10 a
        30 minutos), muy alto hasta −47 °C, severo hasta −54 °C y extremo por debajo. La
        fiabilidad es alta cuando 8 escenarios de cada 10 quedan dentro de un margen de
        6 °C. Para el día completo, la ventana va de las {ski_start} a las {ski_end}.
    params:
      ski_start: "09:00"
      ski_end: "17:00"
      band: summit
      chill_max_c: -20
    display:
      kind: value
      driver: wind_chill_c_p50
      range: [wind_chill_c_p10, wind_chill_c_p90]
      tolerance: 6
      bands:
        - { max: -55, label: { fr: risque extrême, en: extreme risk, es: riesgo extremo } }
        - { max: -48, label: { fr: risque grave, en: severe risk, es: riesgo severo } }
        - { max: -40, label: { fr: risque très élevé, en: very high risk, es: riesgo muy alto } }
        - { max: -28, label: { fr: risque élevé, en: high risk, es: riesgo alto } }
        - { max: -10, label: { fr: risque modéré, en: moderate risk, es: riesgo moderado } }
        - { label: { fr: risque faible, en: low risk, es: riesgo bajo } }
    value: { unit: °C, decimals: 0 }
    order: asc
    drivers:
      wind_chill_c_p90: { label: { fr: Ressenti – scénario doux, en: Felt temperature – mild scenario, es: Sensación térmica – escenario suave }, unit: °C }
      wind_chill_c_p50: { label: { fr: Ressenti le plus froid (médiane), en: Coldest felt temperature (median), es: Sensación térmica más fría (mediana) }, unit: °C }
      wind_chill_c_p10: { label: { fr: Ressenti – scénario froid, en: Felt temperature – cold scenario, es: Sensación térmica – escenario frío }, unit: °C }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: mild_day_chance
    aggregator: mild_day_chance
    filters: [comfort]
    periods: [day]
    visibility: { priority: 0.55, floor: 0.5, strong: 0.9 }
    name: { fr: Journée douce, en: Mild day, es: Día templado }
    description:
      fr: Probabilité d'une journée douce, ensoleillée et sans vent à mi-altitude (temps de pique-nique).
      en: Probability of a mild, sunny and calm day at mid-mountain (picnic weather).
      es: Probabilidad de un día templado, soleado y sin viento a media montaña (tiempo de pícnic).
    method:
      fr: >-
        Pour chacun des 91 scénarios, à mi-altitude, de {ski_start} à {ski_end} : la
        température atteint {temp_min_c} °C, le vent reste sous {wind_max_kmh} km/h et au
        moins {min_sunny_hours} heures sont ensoleillées (nuages au plus {cloud_max_pct} %,
        rayonnement d'au moins {clear_sky_index_min} fois un ciel clair). La probabilité
        est la part des scénarios qui le donnent.
      en: >-
        For each of the 91 scenarios, at mid-mountain, from {ski_start} to {ski_end}: the
        temperature reaches {temp_min_c} °C, the wind stays below {wind_max_kmh} km/h and
        at least {min_sunny_hours} hours are sunny (clouds at most {cloud_max_pct} %,
        sunlight at least {clear_sky_index_min} times a clear sky's). The probability is
        the share of scenarios giving it.
      es: >-
        Para cada uno de los 91 escenarios, a media montaña, de las {ski_start} a las
        {ski_end}: la temperatura alcanza {temp_min_c} °C, el viento se mantiene por
        debajo de {wind_max_kmh} km/h y al menos {min_sunny_hours} horas son soleadas
        (nubes como mucho el {cloud_max_pct} %, radiación de al menos
        {clear_sky_index_min} veces la de un cielo despejado). La probabilidad es la
        proporción de escenarios que lo indican.
    params:
      band: mid
      ski_start: "09:00"
      ski_end: "17:00"
      temp_min_c: 5
      wind_max_kmh: 20
      cloud_max_pct: 30
      clear_sky_index_min: 0.6
      min_sunny_hours: 5
    drivers:
      max_temp_c_p50: { label: { fr: Maximum (médiane), en: Maximum (median), es: Máxima (mediana) }, unit: °C, decimals: 1 }
      sunny_hours_p50: { label: { fr: Heures ensoleillées (médiane), en: Sunny hours (median), es: Horas soleadas (mediana) }, unit: h }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  # 🚗 Getting there
  - id: chains_chance
    aggregator: chains_chance
    filters: [access]
    periods: [day]
    visibility: { priority: 0.85, floor: 0.25, strong: 0.6, alert: 0.6 }
    name: { fr: Chaînes nécessaires, en: Chains needed, es: Cadenas necesarias }
    description:
      fr: Probabilité de neige sur la route d'accès le matin, au niveau du bas de la station.
      en: Probability of snow on the access road in the morning, at the bottom of the resort.
      es: Probabilidad de nieve en la carretera de acceso por la mañana, a la altura de la base de la estación.
    method:
      fr: >-
        Les scénarios ne décrivent pas la route : Bluebird la place au bas de la
        station et y ramène la température de mi-altitude (0,65 °C de plus par 100 m
        plus bas). Pour chacun des 91 scénarios, il additionne la neige tombée de
        {since} la veille à {until} pendant les heures où cette température est d'au
        plus {road_temp_max_c} °C. Il faut des chaînes à partir de {threshold_cm} cm ; la
        probabilité est la part des scénarios qui le donnent. Le déneigement n'est pas
        pris en compte, et l'obligation d'équipement en montagne s'applique de toute façon.
        La tuile affiche « Oui » à partir de 60 %, « Possible » à partir de 25 %, sinon « Non ».
      en: >-
        The scenarios do not describe the road: Bluebird places it at the bottom of
        the resort and brings the mid-mountain temperature down to it (0.65 °C warmer
        per 100 m lower). For each of the 91 scenarios, it adds up the snow fallen from
        {since} the evening before to {until} during the hours when that temperature is
        at most {road_temp_max_c} °C. Chains are needed from {threshold_cm} cm; the
        probability is the share of scenarios giving it. Snow clearing is not taken
        into account, and the mountain winter equipment rules apply anyway.
        The tile shows "Yes" from 60 %, "Possible" from 25 %, otherwise "No".
      es: >-
        Los escenarios no describen la carretera: Bluebird la sitúa en la base de la
        estación y le aplica la temperatura de media montaña corregida (0,65 °C más por
        cada 100 m más abajo). Para cada uno de los 91 escenarios, suma la nieve caída
        desde las {since} de la víspera hasta las {until} durante las horas en las que
        esa temperatura es como mucho de {road_temp_max_c} °C. Hacen falta cadenas a
        partir de {threshold_cm} cm; la probabilidad es la proporción de escenarios que
        lo indican. No se tiene en cuenta la retirada de nieve, y la obligación de
        llevar equipamiento de invierno en montaña se aplica igualmente. La tarjeta
        muestra «Sí» a partir del 60 %, «Posible» a partir del 25 % y, si no, «No».
    params:
      since: "20:00"
      until: "10:00"
      road_temp_max_c: 1.0
      threshold_cm: 2.0
    display:
      kind: levels
      levels:
        - { min: 0.6, label: { fr: Oui, en: "Yes", es: Sí } }
        - { min: 0.25, label: { fr: Possible, en: Possible, es: Posible } }
        - { min: 0, label: { fr: Non, en: "No", es: "No" } }
    drivers:
      road_snow_cm_p50: { label: { fr: Neige sur la route (médiane), en: Snow on the road (median), es: Nieve en la carretera (mediana) }, unit: cm, decimals: 1 }
      road_temp_min_c_p50: { label: { fr: Température minimale sur la route (médiane), en: Lowest road temperature (median), es: Temperatura mínima en la carretera (mediana) }, unit: °C, decimals: 1 }
      base_m: { label: { fr: Altitude de la route, en: Road elevation, es: Altitud de la carretera }, unit: m }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  - id: lift_wind_chance
    aggregator: lift_wind_chance
    filters: [access]
    periods: [day, morning, midday, afternoon]
    visibility: { priority: 0.85, floor: 45, strong: 70, alert: 60 }
    name: { fr: Remontées au vent, en: Lifts in the wind, es: Remontes y viento }
    description:
      fr: "Vent moyen le plus fort au sommet pendant le créneau : les remontées ralentissent ou s'arrêtent dans les fortes rafales."
      en: "Strongest mean wind at the summit during the time slot: lifts slow down or stop in strong gusts."
      es: "Viento medio más fuerte en la cima durante la franja: los remontes reducen la velocidad o se detienen con rachas fuertes."
    method:
      fr: >-
        Pour chacun des 91 scénarios, près du sommet, Bluebird garde le vent moyen le
        plus fort du créneau. La tuile affiche la médiane : la moitié des scénarios
        donnent plus, l'autre moitié moins. Les scénarios n'ont pas les rafales,
        souvent 1,5 à 2 fois plus fortes en montagne : à partir de {wind_min_kmh} km/h
        de vent moyen, les remontées du haut risquent de ralentir ou de fermer. La
        fiabilité est élevée quand 8 scénarios sur 10 tiennent dans un écart de 15
        km/h.
        Pour la journée entière, la fenêtre va de {ski_start} à {ski_end}.
      en: >-
        For each of the 91 scenarios, near the summit, Bluebird keeps the strongest
        mean wind of the slot. The tile shows the median: half of the scenarios give
        more, half give less. The scenarios have no gusts, often 1.5 to 2 times
        stronger in the mountains: from {wind_min_kmh} km/h of mean wind, the top
        lifts may slow down or close. Reliability is high when 8 scenarios out of 10
        fall within 15 km/h of each other.
        For the whole day, the window runs from {ski_start} to {ski_end}.
      es: >-
        Para cada uno de los 91 escenarios, cerca de la cima, Bluebird se queda con el
        viento medio más fuerte de la franja. La tarjeta muestra la mediana: la mitad de
        los escenarios dan más y la otra mitad menos. Los escenarios no incluyen las
        rachas, a menudo de 1,5 a 2 veces más fuertes en montaña: a partir de
        {wind_min_kmh} km/h de viento medio, los remontes de arriba pueden reducir la
        velocidad o cerrar. La fiabilidad es alta cuando 8 escenarios de cada 10 quedan
        dentro de un margen de 15 km/h. Para el día completo, la ventana va de las
        {ski_start} a las {ski_end}.
    params:
      ski_start: "09:00"
      ski_end: "17:00"
      band: summit
      wind_min_kmh: 45
      min_hours: 1
    display:
      kind: value
      driver: max_wind_kmh_p50
      range: [max_wind_kmh_p10, max_wind_kmh_p90]
      tolerance: 15
      bands:
        - { max: 29, label: { fr: faible, en: light, es: escasa } }
        - { max: 44, label: { fr: soutenu, en: strong, es: fuerte } }
        - { label: { fr: fermetures possibles, en: closures likely, es: cierres probables } }
    value: { unit: km/h, decimals: 0 }
    drivers:
      max_wind_kmh_p10: { label: { fr: Vent maximal – scénario faible, en: Maximum wind – light scenario, es: Viento máximo – escenario débil }, unit: km/h }
      max_wind_kmh_p50: { label: { fr: Vent maximal (médiane), en: Maximum wind (median), es: Viento máximo (mediana) }, unit: km/h }
      max_wind_kmh_p90: { label: { fr: Vent maximal – scénario fort, en: Maximum wind – strong scenario, es: Viento máximo – escenario fuerte }, unit: km/h }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  # ⚠️ Safety
  - id: wind_slab_chance
    aggregator: wind_slab_chance
    filters: [safety]
    periods: [day]
    visibility: { priority: 0.85, floor: 0.25, strong: 0.6, alert: 0.6 }
    name: { fr: Neige ventée, en: Wind-blown snow, es: Nieve venteada }
    description:
      fr: Probabilité que le vent transporte la neige fraîche au sommet, signe d'alerte hors-piste. Ne remplace jamais le bulletin d'avalanche.
      en: Probability that the wind moves fresh snow near the summit, a warning sign off-piste. Never a replacement for the avalanche bulletin.
      es: Probabilidad de que el viento transporte la nieve fresca en la cima, señal de alerta fuera de pista. Nunca sustituye al boletín de aludes.
    method:
      fr: >-
        Pour chacun des 91 scénarios, près du sommet : au moins {fresh_snow_cm} cm de neige
        sont tombés dans les {lookback_hours} heures avant {ski_start}, et le vent a atteint
        {wind_min_kmh} km/h depuis le début de cette période jusqu'à {ski_end}. La
        probabilité est la part des scénarios qui réunissent les deux. Lisez toujours le
        bulletin d'estimation du risque d'avalanche de Météo-France.
        La tuile affiche « Oui » à partir de 60 %, « Possible » à partir de 25 %, sinon « Non ».
      en: >-
        For each of the 91 scenarios, near the summit: at least {fresh_snow_cm} cm of snow
        fell in the {lookback_hours} hours before {ski_start}, and the wind reached
        {wind_min_kmh} km/h from the start of that period until {ski_end}. The probability is
        the share of scenarios meeting both. Always read the Météo-France avalanche
        bulletin.
        The tile shows "Yes" from 60 %, "Possible" from 25 %, otherwise "No".
      es: >-
        Para cada uno de los 91 escenarios, cerca de la cima: han caído al menos
        {fresh_snow_cm} cm de nieve en las {lookback_hours} horas anteriores a las
        {ski_start}, y el viento ha alcanzado {wind_min_kmh} km/h desde el inicio de ese
        periodo hasta las {ski_end}. La probabilidad es la proporción de escenarios que
        cumplen ambas condiciones. Consulta siempre el boletín de riesgo de aludes de
        Météo-France. La tarjeta muestra «Sí» a partir del 60 %, «Posible» a partir del
        25 % y, si no, «No».
    params:
      band: summit
      ski_start: "09:00"
      ski_end: "17:00"
      lookback_hours: 48
      fresh_snow_cm: 10
      wind_min_kmh: 30
    display:
      kind: levels
      levels:
        - { min: 0.6, label: { fr: Oui, en: "Yes", es: Sí } }
        - { min: 0.25, label: { fr: Possible, en: Possible, es: Posible } }
        - { min: 0, label: { fr: Non, en: "No", es: "No" } }
    drivers:
      fresh_snow_cm_p50: { label: { fr: Neige fraîche (médiane), en: Fresh snow (median), es: Nieve fresca (mediana) }, unit: cm }
      max_wind_kmh_p50: { label: { fr: Vent maximal (médiane), en: Maximum wind (median), es: Viento máximo (mediana) }, unit: km/h }
      members: { label: { fr: Scénarios analysés, en: Scenarios analysed, es: Escenarios analizados } }

  # ------------------------------------------------------------ historical KPIs
  # Rewind 25/26 (config/rewinds.yaml). Season: from December 1 to May 1.
  - id: season_total_snowfall
    aggregator: season_total_snowfall
    kind: historical
    value: { unit: m, decimals: 2, scale: 0.01 }  # computed in cm, shown in metres
    filters: [rewind-2025-26]
    name: { fr: Cumul de neige de la saison, en: Season snowfall, es: Nieve acumulada de la temporada }
    description:
      fr: Neige tombée sur toute la saison à la station, à mi-altitude.
      en: Snow fallen over the whole season at the resort, at mid-mountain.
      es: Nieve caída durante toda la temporada en la estación, a media montaña.
    method:
      fr: >-
        Bluebird additionne, heure par heure, la neige tombée à mi-altitude au
        point de la station sur toute la saison, d'après les prévisions archivées
        du modèle AROME de Météo-France (maille de 1,5 km). Un jour de neige
        compte au moins {snow_day_cm} cm.
      en: >-
        Bluebird adds up, hour by hour, the snow fallen at mid-mountain at the
        resort point over the whole season, from the archived forecasts of
        Météo-France's AROME model (1.5 km grid). A snow day has at least
        {snow_day_cm} cm.
      es: >-
        Bluebird suma, hora a hora, la nieve caída a media montaña en el punto de la
        estación durante toda la temporada, a partir de las predicciones archivadas del
        modelo AROME de Météo-France (malla de 1,5 km). Un día de nieve tiene al menos
        {snow_day_cm} cm.
    params:
      snow_day_cm: 1.0
      min_coverage: 0.9
    drivers:
      snow_days: { label: { fr: Jours de neige, en: Snow days, es: Días de nieve } }
      best_day: { label: { fr: Plus grosse journée, en: Snowiest day, es: Día más nevado } }
      best_day_cm: { label: { fr: Neige ce jour-là, en: Snow that day, es: Nieve ese día }, unit: cm, decimals: 0 }

  - id: season_longest_snowfall
    aggregator: season_longest_snowfall
    kind: historical
    value: { unit: h, decimals: 0 }
    filters: [rewind-2025-26]
    name: { fr: Plus longue chute de neige, en: Longest snowfall, es: Nevada más larga }
    description:
      fr: La plus longue chute de neige continue de la saison à la station, en heures.
      en: The longest continuous snowfall of the season at the resort, in hours.
      es: La nevada continua más larga de la temporada en la estación, en horas.
    method:
      fr: >-
        Une heure est neigeuse quand il tombe au moins {min_rate_cm_h} cm à
        mi-altitude. Bluebird cherche la plus longue suite d'heures neigeuses de
        la saison ; une accalmie de {max_gap_hours} h au plus ne l'interrompt pas.
      en: >-
        An hour is snowy when at least {min_rate_cm_h} cm falls at mid-mountain.
        Bluebird looks for the longest run of snowy hours of the season; a lull of
        {max_gap_hours} h or less does not break it.
      es: >-
        Una hora es nevada cuando caen al menos {min_rate_cm_h} cm a media montaña.
        Bluebird busca la serie más larga de horas nevadas de la temporada; una pausa de
        {max_gap_hours} h o menos no la interrumpe.
    params:
      min_rate_cm_h: 0.1
      max_gap_hours: 1
      min_coverage: 0.9
    drivers:
      start: { label: { fr: Début, en: Start, es: Inicio } }
      end: { label: { fr: Fin, en: End, es: Fin } }
      snow_cm: { label: { fr: Neige tombée, en: Snow fallen, es: Nieve caída }, unit: cm, decimals: 0 }

  - id: season_domain_snowfall
    aggregator: season_area_snowfall
    kind: historical
    value: { unit: m, decimals: 2, scale: 0.01 }  # computed in cm, shown in metres
    filters: [rewind-2025-26]
    name: { fr: Cumul de neige sur le domaine, en: Season snowfall on the slopes, es: Nieve acumulada en el dominio }
    description:
      fr: Neige tombée sur toute la saison, en moyenne sur le domaine skiable.
      en: Snow fallen over the whole season, averaged over the ski area.
      es: Nieve caída durante toda la temporada, de media en el dominio esquiable.
    method:
      fr: >-
        Bluebird répartit des points à intervalles réguliers le long des pistes
        de la station (OpenStreetMap), additionne la neige de la saison en chacun
        d'eux (modèle AROME, à l'altitude du terrain) et en fait la moyenne.
      en: >-
        Bluebird spreads points at equal distances along the resort's pistes
        (OpenStreetMap), adds up the season's snow at each of them (AROME model,
        at ground elevation) and averages them.
      es: >-
        Bluebird reparte puntos a intervalos regulares a lo largo de las pistas de la
        estación (OpenStreetMap), suma la nieve de la temporada en cada uno de ellos
        (modelo AROME, a la altitud del terreno) y calcula la media.
    params:
      points: domain
      min_coverage: 0.9
    drivers:
      points: { label: { fr: Points mesurés, en: Points measured, es: Puntos medidos } }
      min_cm: { label: { fr: Point le moins enneigé, en: Least snowy point, es: Punto menos nevado }, unit: cm, decimals: 0 }
      max_cm: { label: { fr: Point le plus enneigé, en: Snowiest point, es: Punto más nevado }, unit: cm, decimals: 0 }

  - id: season_offpiste_snowfall
    aggregator: season_area_snowfall
    kind: historical
    value: { unit: m, decimals: 2, scale: 0.01 }  # computed in cm, shown in metres
    filters: [rewind-2025-26]
    name: { fr: Cumul de neige hors-piste, en: Off-piste season snowfall, es: Nieve acumulada fuera de pista }
    description:
      fr: Neige tombée sur toute la saison, en moyenne hors-piste autour du domaine.
      en: Snow fallen over the whole season, averaged off-piste around the ski area.
      es: Nieve caída durante toda la temporada, de media fuera de pista alrededor del dominio.
    method:
      fr: >-
        Bluebird place des points en cercle autour du domaine skiable, un peu
        au-delà de la piste la plus éloignée, additionne la neige de la saison en
        chacun d'eux (modèle AROME, à l'altitude du terrain) et en fait la moyenne.
      en: >-
        Bluebird places points in a circle around the ski area, a little beyond
        the farthest piste, adds up the season's snow at each of them (AROME
        model, at ground elevation) and averages them.
      es: >-
        Bluebird coloca puntos en círculo alrededor del dominio esquiable, un poco más
        allá de la pista más alejada, suma la nieve de la temporada en cada uno de ellos
        (modelo AROME, a la altitud del terreno) y calcula la media.
    params:
      points: offpiste
      min_coverage: 0.9
    drivers:
      points: { label: { fr: Points mesurés, en: Points measured, es: Puntos medidos } }
      min_cm: { label: { fr: Point le moins enneigé, en: Least snowy point, es: Punto menos nevado }, unit: cm, decimals: 0 }
      max_cm: { label: { fr: Point le plus enneigé, en: Snowiest point, es: Punto más nevado }, unit: cm, decimals: 0 }

  - id: season_deep_snow_days
    aggregator: season_snow_depth_days
    kind: historical
    value: { unit: "%", decimals: 0, scale: 100, max: 100 }  # share of days; bars 0-100 %
    filters: [rewind-2025-26]
    name: { fr: Jours d'enneigement idéal, en: Ideal snow cover days, es: Días de innivación ideal }
    description:
      fr: >-
        Part des jours de la saison où le manteau neigeux dépasse 70 cm
        en moyenne sur le domaine : l'enneigement idéal, qui absorbe les
        irrégularités du terrain (voire le paradis de la poudreuse si la neige
        est fraîche).
      en: >-
        Share of the season's days when the snowpack exceeds 70 cm on
        average over the ski area: the ideal cover, smoothing out the bumps of the
        terrain (even powder paradise when the snow is fresh).
      es: >-
        Proporción de días de la temporada en los que el manto de nieve supera los 70 cm
        de media en el dominio: la innivación ideal, que absorbe las irregularidades del
        terreno (incluso el paraíso de la nieve polvo si la nieve es fresca).
    method:
      fr: >-
        Chaque jour, Bluebird fait la moyenne de l'épaisseur de neige au sol sur
        les points répartis le long des pistes et sur les heures de la journée
        (modèle ICON du service météo allemand, maille d'environ 7 km). Un jour
        compte si cette moyenne dépasse {threshold_cm} cm ; le pourcentage est la
        part de ces jours sur la saison.
      en: >-
        Each day, Bluebird averages the snow depth on the ground over the points
        spread along the pistes and over the day's hours (German weather
        service's ICON model, ~7 km grid). A day counts when this average exceeds
        {threshold_cm} cm; the percentage is the share of such days in the season.
      es: >-
        Cada día, Bluebird calcula la media del espesor de nieve en el suelo en los
        puntos repartidos a lo largo de las pistas y en las horas del día (modelo ICON
        del servicio meteorológico alemán, malla de unos 7 km). Un día cuenta si esa
        media supera {threshold_cm} cm; el porcentaje es la proporción de esos días en
        la temporada.
    params:
      points: domain
      threshold_cm: 70.0
      min_coverage: 0.9
    drivers:
      deep_days: { label: { fr: Jours au-dessus du seuil, en: Days above the threshold, es: Días por encima del umbral } }
      days: { label: { fr: Jours de la saison, en: Season days, es: Días de la temporada } }
      max_depth_cm: { label: { fr: Manteau le plus épais, en: Deepest snowpack, es: Manto más grueso }, unit: cm, decimals: 0 }

  - id: season_white_days
    aggregator: season_white_days
    kind: historical
    order: asc   # fewest white days first
    value:
      unit: d
      unit_label: { fr: jours, en: days, es: días }
      unit_label_one: { fr: jour, en: day, es: día }
      decimals: 0
    filters: [rewind-2025-26]
    name: { fr: Jours blancs de la saison, en: White days of the season, es: Días blancos de la temporada }
    description:
      fr: >-
        Nombre de jours blancs de la saison sur le domaine : des journées sans
        relief visible, dans le nuage, sous la neige ou en lumière plate. La
        station qui en a eu le moins est en tête.
      en: >-
        Number of white days of the season on the slopes: days without visible
        relief, inside the cloud, in snowfall or in flat light. The resort with
        the fewest comes first.
      es: >-
        Número de días blancos de la temporada en el dominio: jornadas sin relieve
        visible, dentro de la nube, bajo la nieve o con luz plana. La estación que menos
        ha tenido va en cabeza.
    method:
      fr: >-
        Sur les points répartis le long des pistes, Bluebird regarde chaque heure
        skiable ({ski_start}–{ski_end}) avec le modèle AROME archivé. Une heure est
        blanche si la moitié des points sont dans le nuage (humidité ≥ {rh_min_pct} %
        et nuages bas ≥ {low_cloud_min_pct} %), sous au moins {snowfall_min_cm_h} cm/h
        de neige ou en lumière plate (rayonnement sous {clear_sky_index_max} fois celui
        d'un ciel clair). Un jour est blanc dès {min_white_hours} heures blanches.
      en: >-
        On the points spread along the pistes, Bluebird checks every ski hour
        ({ski_start}–{ski_end}) with the archived AROME model. An hour is white when
        half of the points are inside the cloud (humidity ≥ {rh_min_pct} % and low
        cloud ≥ {low_cloud_min_pct} %), under at least {snowfall_min_cm_h} cm/h of snow
        or in flat light (sunlight below {clear_sky_index_max} times a clear sky's).
        A day is white from {min_white_hours} white hours.
      es: >-
        En los puntos repartidos a lo largo de las pistas, Bluebird revisa cada hora
        esquiable ({ski_start}–{ski_end}) con el modelo AROME archivado. Una hora es
        blanca si la mitad de los puntos están dentro de la nube (humedad ≥ {rh_min_pct}
        % y nubes bajas ≥ {low_cloud_min_pct} %), bajo al menos {snowfall_min_cm_h} cm/h
        de nieve o con luz plana (radiación inferior a {clear_sky_index_max} veces la de
        un cielo despejado). Un día es blanco a partir de {min_white_hours} horas
        blancas.
    params:
      points: domain
      min_point_share: 0.5
      min_coverage: 0.9
      ski_start: "09:00"
      ski_end: "17:00"
      rh_min_pct: 98
      low_cloud_min_pct: 90
      snowfall_min_cm_h: 0.5
      clear_sky_index_max: 0.3
      min_white_hours: 6
