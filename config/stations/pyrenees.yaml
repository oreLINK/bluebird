# yaml-language-server: $schema=../schemas/stations.schema.json
#
# Ski resorts of the French Pyrenees. The file name (without extension) must
# match a massif id from config/massifs.yaml.
#
# Coordinates point at the middle of the ski area, because they select the
# weather model grid cell. Elevations are in metres. `mid` defaults to the
# average of `base` and `summit` rounded to 10 m.
#
# NOTE: coordinates and elevations are approximate public figures. Check them
# against official resort data before relying on them.
#
# `short_name` (max 20 characters) is what the tiles display; `name` is the
# full official name. Each station also has a photo folder:
# web/src/assets/photos/<massif>/<station_id>/ (see the README there).
#
# Times are local (massif timezone), formatted HH:MM.
#   grooming_end: when piste grooming usually finishes. If it is later than
#                 lifts_open (e.g. 22:00), it refers to the previous evening.
#   lifts_open:   when the first lifts open.
defaults:
  grooming_end: "02:00"
  lifts_open: "09:00"

stations:
  - id: font-romeu
    name: Font-Romeu Pyrénées 2000
    short_name: Font-Romeu
    lat: 42.515
    lon: 2.010
    elevation: { base: 1750, summit: 2213 }
    aspects: [N, NE, E]

  - id: les-angles
