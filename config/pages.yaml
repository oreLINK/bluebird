        paragraphs:
          - fr: >-
              Le site est servi par GitHub Pages. Comme tout hébergeur, GitHub peut
              enregistrer l'adresse IP des visiteurs pour la sécurité et le
              fonctionnement du service, sous sa propre responsabilité.
            en: >-
              The site is served by GitHub Pages. Like any host, GitHub may log
              visitors' IP addresses for the security and operation of its service,
              under its own responsibility.
            es: >-
              El sitio lo sirve GitHub Pages. Como cualquier proveedor de alojamiento,
              GitHub puede registrar la dirección IP de los visitantes para la seguridad
              y el funcionamiento de su servicio, bajo su propia responsabilidad.
