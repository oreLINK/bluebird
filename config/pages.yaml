# yaml-language-server: $schema=./schemas/pages.schema.json
#
# Footer and full-window pages (opened over the site, like a sheet).
#
#   footer.repository  link behind the GitHub logo of the footer.
#   footer.pages       ids of the pages linked on the small line below it.
#   pages              each page opens at <site>/#<id>. A section has a title
#                      and paragraphs, links and/or a built-in `block`:
#                        data_sources   attribution of every enabled source
#                                       (config/sources.yaml)
#                        photo_credits  credit of every banner photo
#                                       (web/src/assets/photos/credits.yaml)
#                        local_data     settings stored on the device and a
#                                       button to delete them
#                        tile_front,    an example tile (front or back) with
#                        tile_back      numbered marks, explained by the
#                                       numbered paragraphs of the next section
#                        time_badges    every tile time badge: days, then
#                                       moments (config/periods.yaml)
#                        service_summary, service_sources, service_transforms,
#                        service_kpis, service_tiles
#                                       status of the last refresh
#                                       (diamond/status.json): overall state,
#                                       then one line per data source,
#                                       transformation, indicator and tile of
#                                       the current mountain range
#
# Write long texts with the `>-` folded style, one {fr, en, es} set per paragraph.
footer:
  repository: https://github.com/oreLINK/bluebird
  pages: [about, guide, status, legal, privacy]

pages:
  - id: about
    title:
      fr: À propos
      en: About
      es: Acerca de
    sections:
      - id: what
        title:
          fr: Ce qu'est Bluebird
          en: What Bluebird is
          es: Qué es Bluebird
        paragraphs:
          - fr: >-
              Chaque matin, Bluebird estime pour chaque station la probabilité de
              bonnes conditions de ski : neige dans la journée, poudreuse sur piste
              et poudreuse hors-piste.
            en: >-
              Every morning, Bluebird estimates for each resort the probability of
              good skiing conditions: snow during the day, powder on piste and
              off-piste powder.
            es: >-
              Cada mañana, Bluebird estima para cada estación la probabilidad de buenas
              condiciones de esquí: nieve durante el día, nieve polvo en pista y nieve
              polvo fuera de pista.
      - id: method
        title:
          fr: Comment c'est calculé
          en: How it is computed
          es: Cómo se calcula
        paragraphs:
          - fr: >-
              Chaque probabilité est la part des scénarios de prévision d'ensemble
              qui remplissent la condition. Le verso de chaque tuile détaille la
              méthode et la fiabilité du jour.
            en: >-
              Each probability is the share of ensemble forecast scenarios that
              meet the condition. The back of each tile details the method and
              today's reliability.
            es: >-
              Cada probabilidad es la proporción de escenarios de la predicción por
              conjuntos que cumplen la condición. El reverso de cada tarjeta detalla el
              método y la fiabilidad del día.
      - id: disclaimer
        title:
          fr: Avertissement
          en: Disclaimer
          es: Aviso
        paragraphs:
          - fr: >-
              Bluebird aide à préparer sa journée, ce n'est pas un bulletin
              d'avalanche. Avant tout hors-piste, consultez le bulletin
              d'estimation du risque d'avalanche de Météo-France.
            en: >-
              Bluebird helps you plan your day; it is not an avalanche bulletin.
              Before going off-piste, check the Météo-France avalanche risk
              bulletin.
            es: >-
              Bluebird ayuda a preparar la jornada, no es un boletín de aludes. Antes de
              salir fuera de pista, consulta el boletín de riesgo de aludes de
              Météo-France.
        links:
          - label:
              fr: Bulletins montagne de Météo-France
              en: Météo-France mountain bulletins
              es: Boletines de montaña de Météo-France
            url: https://meteofrance.com/meteo-montagne
      - id: sources
        title:
          fr: Sources des données
          en: Data sources
          es: Fuentes de datos
        block: data_sources

  - id: guide
    title:
      fr: Lire une tuile
      en: Reading a tile
      es: Cómo leer una tarjeta
    sections:
      - id: intro
        title:
          fr: Une tuile, une question
          en: One tile, one question
          es: Una tarjeta, una pregunta
        paragraphs:
          - fr: >-
              Chaque tuile répond à une question pour un moment précis : va-t-il
              neiger ce matin, y aura-t-il de la poudreuse demain ? Les stations y
              sont classées de la plus favorable à la moins favorable, comme les
              cotes d'un match sur un site de paris.
            en: >-
              Each tile answers one question for one moment: will it snow this
              morning, will there be powder tomorrow? Resorts are ranked from the
              most to the least favourable, like the odds of a match on a betting
              site.
            es: >-
              Cada tarjeta responde a una pregunta para un momento concreto:
              ¿nevará esta mañana?, ¿habrá nieve polvo mañana? Las estaciones se
              ordenan de la más favorable a la menos favorable, como las cuotas de
              un partido en una web de apuestas.
          - fr: >-
              Touchez « ? » pour retourner la tuile et lire son verso, puis « × »
              pour revenir.
            en: >-
              Tap "?" to turn the tile over and read its back, then "×" to come
              back.
            es: >-
              Toca «?» para dar la vuelta a la tarjeta y leer su reverso, y «×»
              para volver.
      - id: front
        title:
          fr: Le recto
          en: The front
          es: El anverso
        paragraphs:
          - fr: Les numéros renvoient à la liste ci-dessous.
            en: The numbers refer to the list below.
            es: Los números remiten a la lista de abajo.
        block: tile_front
      - id: front-marks
        title:
          fr: Ce que montre le recto
          en: What the front shows
          es: Lo que muestra el anverso
        paragraphs:
          - fr: >-
              1. La pastille temporelle : le jour et le moment de la journée de ces
              prévisions (détails plus bas).
            en: >-
              1. The time badge: the day and the moment of the day of these
              forecasts (details below).
            es: >-
              1. La etiqueta de tiempo: el día y el momento del día de estas
              previsiones (detalles más abajo).
          - fr: >-
              2. LIVE : la webcam de la station en tête, à regarder en direct
              pendant le créneau (nouvel onglet). D'autres badges peuvent prendre
              cette place : REWIND sur les bilans de saison, ou « Données de
              06:00 » quand les valeurs viennent d'une mise à jour plus ancienne.
            en: >-
              2. LIVE: the webcam of the leading resort, to watch live during the
              slot (new tab). Other badges can take this place: REWIND on season
              reviews, or "Data from 06:00" when the values come from an earlier
              update.
            es: >-
              2. LIVE: la webcam de la estación en cabeza, para verla en directo
              durante la franja (nueva pestaña). Otras etiquetas pueden ocupar
              este lugar: REWIND en los balances de temporada, o «Datos de las
              06:00» cuando los valores vienen de una actualización anterior.
          - fr: >-
              3. « ? » retourne la tuile pour voir comment l'indicateur est
              calculé.
            en: >-
              3. "?" turns the tile over to see how the indicator is computed.
            es: >-
              3. «?» da la vuelta a la tarjeta para ver cómo se calcula el
              indicador.
          - fr: >-
              4. Le titre : ce qui est estimé (neige, poudreuse, grand soleil…).
            en: >-
              4. The title: what is estimated (snow, powder, full sun…).
            es: >-
              4. El título: lo que se estima (nieve, nieve polvo, pleno sol…).
          - fr: >-
              5. Les trois meilleures stations, comme des boutons de cote : leur
              nom et leur valeur. Selon l'indicateur, la valeur est une
              probabilité (82 %), une quantité probable (18 cm, 9 h) ou un verdict
              (Oui, Possible, Non).
            en: >-
              5. The three best resorts, as odds buttons: their name and their
              value. Depending on the indicator, the value is a probability
              (82 %), a likely amount (18 cm, 9 h) or a verdict (Yes, Possible,
              No).
            es: >-
              5. Las tres mejores estaciones, como botones de cuota: su nombre y
              su valor. Según el indicador, el valor es una probabilidad (82 %),
              una cantidad probable (18 cm, 9 h) o un veredicto (Sí, Posible,
              No).
          - fr: >-
              6. La fiabilité, en trois points : plus il y a de points pleins,
              plus les scénarios de prévision sont d'accord entre eux.
            en: >-
              6. Reliability, in three dots: the more filled dots, the more the
              forecast scenarios agree with each other.
            es: >-
              6. La fiabilidad, en tres puntos: cuantos más puntos llenos, más
              coinciden entre sí los escenarios de previsión.
          - fr: >-
              7. La barre montre la même valeur d'un coup d'œil : plus elle est
              longue, meilleures sont les chances.
            en: >-
              7. The bar shows the same value at a glance: the longer it is, the
              better the chances.
            es: >-
              7. La barra muestra el mismo valor de un vistazo: cuanto más larga,
              mejores son las probabilidades.
          - fr: >-
              8. « Voir les stations » déplie le classement complet, avec la
              fiabilité de chaque station.
            en: >-
              8. "See all resorts" opens the full ranking, with the reliability of
              each resort.
            es: >-
              8. «Ver las estaciones» despliega la clasificación completa, con la
              fiabilidad de cada estación.
      - id: time-badge
        title:
          fr: La pastille temporelle
          en: The time badge
          es: La etiqueta de tiempo
        paragraphs:
          - fr: >-
              La case de gauche donne le jour, dans sa couleur sombre ; celle de
              droite le moment de la journée, dans une couleur claire, avec une
              icône. Une tuile qui couvre toute la journée n'affiche que le jour,
              et celles de la nuit qui vient affichent « Cette nuit ». Le verso
              redonne la date exacte et les heures.
            en: >-
              The left box gives the day, in its dark colour; the right box the
              moment of the day, in a light colour, with an icon. A tile for the
              whole day only shows the day, and tiles for the coming night show
              "Tonight". The back gives the exact date and hours.
            es: >-
              La casilla de la izquierda indica el día, en su color oscuro; la de
              la derecha, el momento del día, en un color claro y con un icono.
              Una tarjeta de todo el día solo muestra el día, y las de la noche
              que llega muestran «Esta noche». El reverso indica la fecha y las
              horas exactas.
        block: time_badges
      - id: formats
        title:
          fr: Trois tailles
          en: Three sizes
          es: Tres tamaños
        paragraphs:
          - fr: >-
              Les grandes tuiles montrent une photo de la station en tête (ou un
              dessin), sur toute la carte ou en bandeau. Les tuiles compactes,
              sans image, servent aux indicateurs plus bas dans la page. Toutes se
              lisent de la même façon.
            en: >-
              Large tiles show a photo of the leading resort (or a drawing),
              across the whole card or as a band. Compact tiles, without a
              picture, are used for the indicators lower on the page. All of them
              read the same way.
            es: >-
              Las tarjetas grandes muestran una foto de la estación en cabeza (o
              un dibujo), en toda la tarjeta o en una franja. Las tarjetas
              compactas, sin imagen, sirven para los indicadores más abajo en la
              página. Todas se leen de la misma manera.
      - id: back
        title:
          fr: Le verso
          en: The back
          es: El reverso
        paragraphs:
          - fr: Les numéros renvoient à la liste ci-dessous.
            en: The numbers refer to the list below.
            es: Los números remiten a la lista de abajo.
        block: tile_back
      - id: back-marks
        title:
          fr: Ce que dit le verso
          en: What the back says
          es: Lo que dice el reverso
        paragraphs:
          - fr: "1. Ce que ça mesure : la question à laquelle répond l'indicateur."
            en: "1. What it measures: the question the indicator answers."
            es: "1. Qué mide: la pregunta a la que responde el indicador."
          - fr: >-
              2. Quand ? : la pastille temporelle, la période en toutes lettres et
              sa date exacte, avec les heures.
            en: >-
              2. When?: the time badge, the period in words and its exact date,
              with the hours.
            es: >-
              2. ¿Cuándo?: la etiqueta de tiempo, el periodo en palabras y su
              fecha exacta, con las horas.
          - fr: >-
              3. Période étudiée : les heures prises en compte par le calcul (par
              exemple 08:00 → 17:00 pour la neige de la journée).
            en: >-
              3. Time window: the hours the computation looks at (for example
              08:00 → 17:00 for the snow of the day).
            es: >-
              3. Franja horaria: las horas que tiene en cuenta el cálculo (por
              ejemplo 08:00 → 17:00 para la nieve del día).
          - fr: >-
              4. Comment c'est calculé : la règle appliquée à chaque scénario de
              prévision, avec ses seuils.
            en: >-
              4. How it is computed: the rule applied to every forecast scenario,
              with its thresholds.
            es: >-
              4. Cómo se calcula: la regla aplicada a cada escenario de previsión,
              con sus umbrales.
          - fr: >-
              5. Fiabilité sur ce créneau : l'accord entre les scénarios, pour
              l'ensemble des stations.
            en: >-
              5. Reliability for this time slot: how much the scenarios agree,
              over all the resorts.
            es: >-
              5. Fiabilidad para esta franja: cuánto coinciden los escenarios, en
              el conjunto de las estaciones.
          - fr: "6. Mise à jour : le jour et l'heure du calcul."
            en: "6. Last update: the day and time of the computation."
            es: "6. Última actualización: el día y la hora del cálculo."
          - fr: "7. Sources : d'où viennent les données."
            en: "7. Sources: where the data comes from."
            es: "7. Fuentes: de dónde vienen los datos."
          - fr: "8. Crédit photo : l'auteur et la licence de la photo du recto."
            en: "8. Photo credit: the author and licence of the front photo."
            es: "8. Crédito de la foto: el autor y la licencia de la foto del anverso."
          - fr: "9. « × » revient au recto ; toucher le verso fait de même."
            en: "9. \"×\" goes back to the front; tapping the back does the same."
            es: "9. «×» vuelve al anverso; tocar el reverso hace lo mismo."
      - id: rewind
        title:
          fr: Les tuiles Rewind
          en: Rewind tiles
          es: Las tarjetas Rewind
        paragraphs:
          - fr: >-
              Sous le filtre rouge Rewind, les tuiles font le bilan d'une saison
              terminée : des valeurs mesurées (4,43 m de neige, 46 h de chute), en
              rouge, sans pastille temporelle ni points de fiabilité.
            en: >-
              Under the red Rewind filter, tiles review a closed season: measured
              values (4.43 m of snow, 46 h of snowfall), in red, without a time
              badge or reliability dots.
            es: >-
              Con el filtro rojo Rewind, las tarjetas hacen balance de una
              temporada terminada: valores medidos (4,43 m de nieve, 46 h de
              nevada), en rojo, sin etiqueta de tiempo ni puntos de fiabilidad.

  - id: legal
    title:
      fr: Mentions légales
      en: Legal notice
      es: Aviso legal
    sections:
      - id: publisher
        title:
          fr: Éditeur
          en: Publisher
          es: Editor
        paragraphs:
          - fr: >-
              Bluebird est un site personnel, gratuit et non commercial, édité par
              Aurélien Bertrand, qui en est aussi le directeur de la publication.
            en: >-
              Bluebird is a personal, free and non-commercial website published by
              Aurélien Bertrand, who is also its publication director.
            es: >-
              Bluebird es un sitio personal, gratuito y sin ánimo de lucro, editado por
              Aurélien Bertrand, que es también su director de publicación.
          - fr: >-
              Contact : par une « issue » sur le dépôt GitHub du projet.
            en: >-
              Contact: through an issue on the project's GitHub repository.
            es: >-
              Contacto: mediante una «issue» en el repositorio GitHub del proyecto.
        links:
          - label:
              fr: Contacter l'éditeur (GitHub)
              en: Contact the publisher (GitHub)
              es: Contactar con el editor (GitHub)
            url: https://github.com/oreLINK/bluebird/issues
      - id: host
        title:
          fr: Hébergeur
          en: Host
          es: Proveedor de alojamiento
        paragraphs:
          - fr: >-
              GitHub, Inc. (service GitHub Pages), 88 Colin P. Kelly Jr. Street,
              San Francisco, CA 94107, États-Unis.
            en: >-
              GitHub, Inc. (GitHub Pages service), 88 Colin P. Kelly Jr. Street,
              San Francisco, CA 94107, United States.
            es: >-
              GitHub, Inc. (servicio GitHub Pages), 88 Colin P. Kelly Jr. Street, San
              Francisco, CA 94107, Estados Unidos.
        links:
          - label:
              fr: github.com
              en: github.com
              es: github.com
            url: https://github.com/
      - id: property
        title:
          fr: Propriété intellectuelle
          en: Intellectual property
          es: Propiedad intelectual
        paragraphs:
          - fr: >-
              Les photos appartiennent à leurs auteurs et sont publiées selon leur
              licence, indiquée ci-dessous. Les données météo et les tracés des
              domaines skiables proviennent des sources citées dans « À propos ».
            en: >-
              Photos belong to their authors and are published under their licence,
              listed below. Weather data and ski area maps come from the sources
              listed in "About".
            es: >-
              Las fotos pertenecen a sus autores y se publican según su licencia,
              indicada a continuación. Los datos meteorológicos y los trazados de los
              dominios esquiables proceden de las fuentes citadas en «Acerca de».
      - id: photos
        title:
          fr: Crédits photo
          en: Photo credits
          es: Créditos de las fotos
        block: photo_credits

  - id: status
    title:
      fr: État du service
      en: Service status
      es: Estado del servicio
    sections:
      - id: summary
        title:
          fr: Dernière mise à jour
          en: Last update
          es: Última actualización
        paragraphs:
          - fr: >-
              Bluebird met à jour ses données toutes les 6 heures (vers 0 h, 6 h,
              12 h et 18 h, heure de Paris, de novembre à mai). Cette page dit
              comment s'est passée la dernière mise à jour.
            en: >-
              Bluebird updates its data every 6 hours (around midnight, 6 am, noon
              and 6 pm, Paris time, from November to May). This page tells how the
              last update went.
            es: >-
              Bluebird actualiza sus datos cada 6 horas (hacia las 0 h, 6 h, 12 h y 18
              h, hora de París, de noviembre a mayo). Esta página indica cómo fue la
              última actualización.
        block: service_summary

      - id: sources
        title:
          fr: Sources de données (API)
          en: Data sources (APIs)
          es: Fuentes de datos (API)
        block: service_sources

      - id: transforms
        title:
          fr: Transformations
          en: Data processing
          es: Procesamiento de datos
        block: service_transforms

      - id: kpis
        title:
          fr: Indicateurs
          en: Indicators
          es: Indicadores
        block: service_kpis

      - id: tiles
        title:
          fr: Tuiles
          en: Tiles
          es: Tarjetas
        paragraphs:
          - fr: Les tuiles du massif affiché, pour les créneaux qui ne sont pas encore passés.
            en: The tiles of the mountain range shown, for the time slots not over yet.
            es: Las tarjetas del macizo mostrado, para las franjas que aún no han pasado.
        block: service_tiles

      - id: states
        title:
          fr: Comprendre les états
          en: Understanding the states
          es: Entender los estados
        paragraphs:
          - fr: "Disponible : données fraîches et complètes."
            en: "Available: fresh and complete data."
            es: "Disponible: datos recientes y completos."
          - fr: "Partiel : données fraîches, mais certaines stations manquent."
            en: "Partial: fresh data, but some resorts are missing."
            es: "Parcial: datos recientes, pero faltan algunas estaciones."
          - fr: >-
              Ancien : les valeurs affichées viennent d'une mise à jour précédente
              (par exemple « données de 06:00 »), car la dernière n'a pas pu les
              calculer. La tuile porte alors un badge avec cette heure.
            en: >-
              Outdated: the values shown come from an earlier update (for example
              "data from 06:00"), because the last one could not compute them. The
              tile then carries a badge with that time.
            es: >-
              Antiguo: los valores mostrados proceden de una actualización anterior (por
              ejemplo «datos de las 06:00»), porque la última no pudo calcularlos. La
              tarjeta lleva entonces una etiqueta con esa hora.
          - fr: "Indisponible : aucune valeur pour l'instant."
            en: "Unavailable: no value for now."
            es: "No disponible: ningún valor por ahora."

  - id: privacy
    title:
      fr: Confidentialité
      en: Privacy
      es: Privacidad
    sections:
      - id: no-data
        title:
          fr: Aucune donnée collectée
          en: No data collected
          es: Ningún dato recogido
        paragraphs:
          - fr: >-
              Bluebird ne collecte aucune donnée personnelle : pas de compte, pas de
              formulaire, pas de mesure d'audience, pas de publicité et pas de
              cookie. Les polices, les images et les prévisions sont servies par le
              site lui-même, sans appel à un service tiers.
            en: >-
              Bluebird collects no personal data: no account, no form, no
              analytics, no advertising and no cookies. Fonts, images and forecasts
              are served by the site itself, without calling any third-party
              service.
            es: >-
              Bluebird no recoge ningún dato personal: ni cuenta, ni formulario, ni
              medición de audiencia, ni publicidad, ni cookies. Las fuentes
              tipográficas, las imágenes y las previsiones las sirve el propio sitio,
              sin llamar a ningún servicio externo.
          - fr: >-
              Le badge LIVE d'une tuile est un simple lien : il ouvre la webcam de la
              station sur le site de son diffuseur (Skaping), dans un nouvel onglet,
              seulement si vous le touchez. Ce site applique sa propre politique de
              confidentialité.
            en: >-
              The LIVE badge of a tile is a plain link: it opens the resort's webcam
              on its provider's website (Skaping), in a new tab, only if you tap it.
              That website applies its own privacy policy.
            es: >-
              La etiqueta EN DIRECTO de una tarjeta es un simple enlace: abre la
              webcam de la estación en la web de su proveedor (Skaping), en una nueva
              pestaña, solo si la tocas. Esa web aplica su propia política de
              privacidad.
      - id: device
        title:
          fr: Données enregistrées sur votre appareil
          en: Data stored on your device
          es: Datos guardados en tu dispositivo
        paragraphs:
          - fr: >-
              Pour retrouver vos choix à la prochaine visite, le site enregistre
              quatre réglages dans le stockage local de votre navigateur (ce ne sont
              pas des cookies) : la langue, l'apparence (Système, Clair ou Sombre),
              le lieu choisi et le premier niveau du filtre. Ils ne quittent jamais
              votre appareil et ne sont envoyés à personne.
            en: >-
              To remember your choices for your next visit, the site saves four
              settings in your browser's local storage (these are not cookies): the
              language, the appearance (System, Light or Dark), the chosen place and
              the first level of the filter. They never leave your device and are
              sent to no one.
            es: >-
              Para recordar tus elecciones en la próxima visita, el sitio guarda
              cuatro ajustes en el almacenamiento local de tu navegador (no son
              cookies): el idioma, la apariencia (Sistema, Claro u Oscuro), el lugar
              elegido y el primer nivel del filtro. Nunca salen de tu dispositivo y no
              se envían a nadie.
          - fr: >-
              Ces réglages n'ont pas de date d'expiration : ils restent jusqu'à ce que
              vous les supprimiez. Safari (iPhone, iPad, Mac) les efface toutefois
              après 7 jours sans visite, sauf si le site est ajouté à l'écran
              d'accueil. Un navigateur peut aussi les supprimer s'il manque d'espace,
              et la navigation privée les efface à la fermeture de la fenêtre.
            en: >-
              These settings have no expiry date: they stay until you delete them.
              Safari (iPhone, iPad, Mac) however clears them after 7 days without a
              visit, unless the site is added to the home screen. A browser may also
              delete them when it runs out of space, and private browsing clears
              them when the window closes.
            es: >-
              Estos ajustes no tienen fecha de caducidad: se conservan hasta que los
              borres. Safari (iPhone, iPad, Mac) los borra, sin embargo, tras 7 días
              sin visitas, salvo si el sitio se ha añadido a la pantalla de inicio. Un
              navegador también puede borrarlos si le falta espacio, y la navegación
              privada los borra al cerrar la ventana.
          - fr: >-
              Vous pouvez les supprimer ici à tout moment, ou depuis les réglages du
              navigateur. Le site revient alors à ses réglages par défaut.
            en: >-
              You can delete them here at any time, or in your browser settings. The
              site then goes back to its default settings.
            es: >-
              Puedes borrarlos aquí en cualquier momento, o desde los ajustes del
              navegador. El sitio vuelve entonces a sus ajustes por defecto.
        block: local_data
      - id: hosting
        title:
          fr: Hébergement
          en: Hosting
