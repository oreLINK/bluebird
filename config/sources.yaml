# yaml-language-server: $schema=./schemas/sources.schema.json
#
# Data sources. Each source pairs a bronze Extractor with a silver Transformer
# (see pipeline/src/bluebird_pipeline/bronze/ and silver/).
#   schedule: daily     -> run by the daily GitHub Actions workflow
#             on_demand -> run only with `bluebird run --source <id>`
#   params:   validated by the Extractor's `Params` model. Every extractor also
#             accepts min_interval_s, rate_limit_wait_s and max_rate_limit_waits.
#   attribution: displayed in the site footer (required by most licences).
#
# Open-Meteo free tier: non-commercial use, about 600 weighted calls per minute
# and 10,000 per day. Ensemble requests weigh a lot (each member counts), so
# only request the bands and days the KPIs actually use.
sources:
  - id: open_meteo_ensemble
    extractor: open_meteo_ensemble
    transformer: open_meteo_ensemble
    enabled: true
    schedule: daily
    params:
      models: [ecmwf_ifs025, icon_seamless]
      hourly: [snowfall, temperature_2m, wind_speed_10m]
      bands: [mid, summit]
      past_days: 2          # covers the 36 h off-piste lookback
      forecast_days: 1      # KPIs only describe today
      min_interval_s: 3
    attribution:
      name: Open-Meteo (ECMWF IFS ENS, DWD ICON-EPS)
      url: https://open-meteo.com/
      license: CC BY 4.0

  - id: open_meteo_forecast
    extractor: open_meteo_forecast
    transformer: open_meteo_forecast
    enabled: true
    schedule: daily
    params:
      models: [meteofrance_seamless]
      hourly:
        - snowfall
        - precipitation
        - rain
        - temperature_2m
        - wind_speed_10m
        - wind_gusts_10m
        - freezing_level_height
        - cloud_cover
      bands: [base, mid, summit]
      past_days: 2
      forecast_days: 3
      min_interval_s: 0.5
    attribution:
      name: Open-Meteo (Météo-France AROME / ARPEGE)
      url: https://open-meteo.com/
      license: CC BY 4.0

  - id: osm_overpass
    extractor: osm_overpass
    transformer: osm_overpass
    enabled: true
    schedule: on_demand
    params:
      radius_m: 4000
    attribution:
      name: OpenStreetMap contributors
      url: https://www.openstreetmap.org/copyright
      license: ODbL
