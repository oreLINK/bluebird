# yaml-language-server: $schema=./schemas/sources.schema.json
#
# Data sources. Each source pairs a bronze Extractor with a silver Transformer
# (see pipeline/src/bluebird_pipeline/bronze/ and silver/).
#   schedule: daily     -> run by the daily GitHub Actions workflow
#             on_demand -> run only with `bluebird run --source <id>`
#             reference -> slow-changing data (pistes, lifts…), refreshed with
#                          `bluebird reference` once a season and committed under
#                          config/reference/. Never fetched by the daily run.
#             season    -> archive of a closed season for the Rewinds
#                          (config/rewinds.yaml), fetched once by `bluebird rewind`
#                          and committed under config/rewind/. Never fetched daily.
#   params:   validated by the Extractor's `Params` model. Every extractor also
#             accepts min_interval_s, rate_limit_wait_s and max_rate_limit_waits.
#   attribution: displayed on the tile backs and the "about" page (required by most licences).
#
# Open-Meteo free tier: non-commercial use, about 600 weighted calls per minute
# and 10,000 per day. Ensemble requests weigh a lot (each member counts), so
# only request the bands and days the KPIs actually use.
sources:
  - id: open_meteo_ensemble
    extractor: open_meteo_ensemble
    transformer: open_meteo_ensemble
    enabled: true
    schedule: daily
    params:
      models: [ecmwf_ifs025, icon_seamless]
      # humidity, low cloud and radiation: white days (whiteout_chance KPIs);
      # ICON has no low cloud cover, so its scenarios use the total cloud cover.
      hourly:
        - snowfall
        - temperature_2m
        - wind_speed_10m
        - relative_humidity_2m
        - cloud_cover
        - cloud_cover_low
        - shortwave_radiation
      bands: [mid, summit]
      past_days: 2          # covers the 36 h off-piste lookback
      forecast_days: 2      # today, and tomorrow for whiteout_chance_tomorrow
      min_interval_s: 3
    attribution:
      name: Open-Meteo (ECMWF IFS ENS, DWD ICON-EPS)
      url: https://open-meteo.com/
      license: CC BY 4.0

  - id: open_meteo_forecast
    extractor: open_meteo_forecast
    transformer: open_meteo_forecast
    enabled: true
    schedule: daily
    params:
      models: [meteofrance_seamless]
      hourly:
        - snowfall
        - precipitation
        - rain
        - temperature_2m
        - wind_speed_10m
        - wind_gusts_10m
        - freezing_level_height
        - cloud_cover
      bands: [base, mid, summit]
      past_days: 2
      forecast_days: 3
      min_interval_s: 0.5
    attribution:
      name: Open-Meteo (Météo-France AROME / ARPEGE)
      url: https://open-meteo.com/
      license: CC BY 4.0

  # Rewind: the season archive of AROME HD (1.5 km), hour by hour, at the station
  # point and at points along and around each ski area. A five-month season
  # weighs ~11 calls per point for Open-Meteo: keep min_interval_s high.
  - id: open_meteo_historical
    extractor: open_meteo_historical
    transformer: open_meteo_historical
    enabled: true
    schedule: season
    params:
      models: [meteofrance_seamless]
      hourly: [snowfall, sunshine_duration, cloud_cover, weather_code]
      band: mid
      domain_points: 8
      offpiste_points: 8
      offpiste_margin_m: 800
      min_interval_s: 20
    attribution:
      name: Open-Meteo Historical Forecast (Météo-France AROME)
      url: https://open-meteo.com/
      license: CC BY 4.0

  # Rewind: snow depth on the ground. AROME has none in the archive, so it comes
  # from DWD ICON (icon_seamless, ~7 km over the Pyrenees, not downscaled to the
  # point elevation), at the station point and along the pistes only.
  # Rows are merged into the same hourly file (`bluebird rewind --source <id>`
  # refreshes one source and keeps the other's rows).
  - id: open_meteo_historical_snowpack
    extractor: open_meteo_historical
    transformer: open_meteo_historical
    enabled: true
    schedule: season
    params:
      models: [icon_seamless]
      hourly: [snow_depth]
      band: mid
      domain_points: 8
      offpiste_points: 0
      min_interval_s: 12
    attribution:
      name: Open-Meteo Historical Forecast (DWD ICON)
      url: https://open-meteo.com/
      license: CC BY 4.0

  # Rewind: humidity, low cloud and radiation for the white days, at the same
  # station and domain points as `open_meteo_historical` (same model): merged
  # column by column into the hourly file.
  - id: open_meteo_historical_light
    extractor: open_meteo_historical
    transformer: open_meteo_historical
    enabled: true
    schedule: season
    params:
      models: [meteofrance_seamless]
      hourly: [relative_humidity_2m, cloud_cover_low, shortwave_radiation]
      band: mid
      domain_points: 8
      offpiste_points: 0
      min_interval_s: 12
    attribution:
      name: Open-Meteo Historical Forecast (Météo-France AROME)
      url: https://open-meteo.com/
      license: CC BY 4.0

  - id: osm_overpass
    extractor: osm_overpass
    transformer: osm_overpass
    enabled: true
    schedule: reference
    params:
      radius_m: 4000
    attribution:
      name: OpenStreetMap contributors
      url: https://www.openstreetmap.org/copyright
      license: ODbL
