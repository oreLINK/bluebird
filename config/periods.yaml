# yaml-language-server: $schema=./schemas/periods.schema.json
#
# Time periods the KPIs are computed for, and the labels that name them in
# tile titles ("Neige {period}" -> "Neige ce soir").
#
#   day_start:    local time a "ski day" starts. Ski day D runs from D 06:00 to
#                 D+1 06:00, so "cette nuit" (00:00-06:00) belongs to the evening
#                 before, and a refresh at 00:00 still describes the same ski day.
#   horizon_days: ski days published by each refresh (2 = today and tomorrow).
#   periods:
#     start, end:    local HH:MM. The time slots (periods without native_window)
#                    must cover the ski day exactly once, without gap or overlap.
#     native_window: the KPI uses its own window (e.g. 08:00-17:00 for snowfall,
#                    lifts opening for powder); start/end then only decide when
#                    the period is shown.
#     labels:        one per day of the horizon: [today, tomorrow].
#     chip:          label of the time slot in the `slot` filter level
#                    (config/filters.yaml); required for time slots.
#   days:            chips of the `day` filter level, one per day of the horizon.
#
# A period is published and displayed until its end: after 12:00 "ce matin" is
# gone, after 18:00 "ce midi" and "cet après-midi" are gone. The site also hides
# ended periods by itself between two refreshes.
#
# KPIs choose their periods with `periods: [...]` in config/kpis.yaml.
day_start: "06:00"
horizon_days: 2
days:
  - { fr: Aujourd'hui, en: Today, es: Hoy }
  - { fr: Demain, en: Tomorrow, es: Mañana }
periods:
  - id: day
    start: "06:00"
    end: "18:00"
    native_window: true
    labels:
      - { fr: aujourd'hui, en: today, es: hoy }
      - { fr: demain, en: tomorrow, es: mañana }

  # The sunset of the day (sunset_chance KPI): its own window, computed for each
  # resort; shown until 22:00 since spring sunsets come after 18:00.
  - id: sunset
    start: "06:00"
    end: "22:00"
    native_window: true
    labels:
      - { fr: ce soir, en: tonight, es: esta tarde }
      - { fr: demain soir, en: tomorrow evening, es: mañana por la tarde }

  # The night of the ski day as a whole (snowmaking KPI): day-grain version of
  # the `night` slot, shown all day until the night ends (06:00 the next day).
  - id: overnight
    start: "06:00"
    end: "06:00"
    native_window: true
    labels:
      - { fr: cette nuit, en: tonight, es: esta noche }
      - { fr: la nuit de demain, en: tomorrow night, es: mañana por la noche }

  - id: morning
    start: "06:00"
    end: "12:00"
    chip: { fr: Matin, en: Morning, es: Por la mañana }
    labels:
      - { fr: ce matin, en: this morning, es: esta mañana }
      - { fr: demain matin, en: tomorrow morning, es: mañana por la mañana }

  - id: midday
    start: "12:00"
    end: "14:00"
    chip: { fr: Midi, en: Lunchtime, es: A mediodía }
    labels:
      - { fr: ce midi, en: at lunchtime, es: a mediodía }
      - { fr: demain midi, en: tomorrow lunchtime, es: mañana a mediodía }

  - id: afternoon
    start: "14:00"
    end: "18:00"
    chip: { fr: Après-midi, en: Afternoon, es: Por la tarde }
    labels:
      - { fr: cet après-midi, en: this afternoon, es: esta tarde }
      - { fr: demain après-midi, en: tomorrow afternoon, es: mañana por la tarde }

  - id: evening
    start: "18:00"
    end: "00:00"
    chip: { fr: Soir, en: Evening, es: Por la noche }
    labels:
      - { fr: ce soir, en: this evening, es: esta noche }
      - { fr: demain soir, en: tomorrow evening, es: mañana por la noche }

  - id: night
    start: "00:00"
    end: "06:00"
    chip: { fr: Nuit, en: Night, es: De madrugada }
    labels:
      - { fr: cette nuit, en: tonight, es: esta madrugada }
      - { fr: la nuit de demain, en: tomorrow night, es: la madrugada de mañana }
